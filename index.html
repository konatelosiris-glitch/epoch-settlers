<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>Epoch Settlers 3D</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a1a; color: #eee; overflow: hidden; height: 100dvh; touch-action: none; }
#ui { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; z-index: 10; padding-top: env(safe-area-inset-top); }
#top-bar { background: rgba(22,33,62,0.95); padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 4px; font-size: 11px; pointer-events: auto; }
.resource { background: #0f3460; padding: 3px 7px; border-radius: 10px; white-space: nowrap; }
.resource span { font-weight: bold; color: #ffd166; }
#bottom-ui { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(22,33,62,0.97); padding: 6px 8px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); max-height: 34vh; overflow-y: auto; pointer-events: auto; }
.mode-btn, .build-btn, .ctrl { background: #0f3460; border: 1px solid #e94560; color: white; padding: 7px 9px; border-radius: 6px; font-size: 12px; margin: 2px; min-height: 36px; }
.mode-btn.selected, .build-btn.selected { background: #e94560; }
#canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#log { font-size: 12px; color: #a8dadc; margin: 4px 0; min-height: 16px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="ui">
  <div id="top-bar">
    <div class="resource">🍞 <span id="res-food">180</span></div>
    <div class="resource">🪵 <span id="res-wood">120</span></div>
    <div class="resource">🪨 <span id="res-stone">80</span></div>
    <div class="resource">⚫ <span id="res-coal">0</span></div>
    <div class="resource">⚙️ <span id="res-iron">0</span></div>
    <div class="resource">👥 <span id="res-pop">10</span></div>
    <div class="resource">🙏 <span id="res-belief">60</span></div>
  </div>
  <div id="bottom-ui">
    <div id="modes">
      <button class="mode-btn selected" data-mode="build">🏗️ Stavanie</button>
      <button class="mode-btn" data-mode="sculpt-up">⬆️ Zvýšiť</button>
      <button class="mode-btn" data-mode="sculpt-down">⬇️ Znížiť</button>
      <button class="mode-btn" data-mode="mine">⛏️ Ťažiť</button>
    </div>
    <div id="build-menu"></div>
    <div id="log"></div>
  </div>
</div>
<div id="canvas-container"></div>
<script>
const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
function makeTexture(base, variation = 40, size = 64) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < variation * 2; i++) {
    const g = Math.random() * 50 - 25;
    ctx.fillStyle = `rgba(${g+30},${g+40},${g+10},${0.12 + Math.random()*0.2})`;
    ctx.fillRect(Math.random()*size, Math.random()*size, 1 + Math.random()*2, 1 + Math.random()*2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5, 5);
  return tex;
}
const texGrass = makeTexture('#3e7a32', 45);
const texWood = makeTexture('#6d4c41', 25);
const texStone = makeTexture('#607d8b', 35);
const texWater = makeTexture('#1e88e5', 20);
const GRID = isMobile ? 20 : 26, TILE = 2;
let mode = 'build', selectedBuilding = 'hut';
let resources = { food: 180, wood: 120, stone: 80, coal: 0, iron: 0, pop: 10, belief: 60, science: 0 };
let terrainHeights = Array.from({length: GRID}, () => Array(GRID).fill(0));
let buildings = [];
let trees = [];
let rocks = [];
let riverTiles = new Set();
const buildingTypes = {
  hut: { name: "Chata", cost: { wood: 6, stone: 3 }, prod: { food: 1.5 }, height: 1.3, color: 0x8d6e63 },
  farm: { name: "Farma", cost: { wood: 8, stone: 4 }, prod: { food: 5 }, height: 1.0, color: 0x66bb6a },
  house: { name: "Dom", cost: { wood: 10, stone: 6 }, prod: { pop: 2 }, height: 1.8, color: 0xffcc80 },
  mine: { name: "Baňa", cost: { wood: 5, stone: 10 }, prod: { stone: 2, coal: 0.5 }, height: 1.5, color: 0x78909c }
};
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, isMobile ? 80 : 120);
const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 250);
camera.position.set(GRID*TILE/2, 18, GRID*TILE/2 + 14);
const renderer = new THREE.WebGLRenderer({ 
  antialias: !isMobile, 
  powerPreference: isMobile ? "low-power" : "high-performance" 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.25 : 1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(GRID*TILE/2, 0, GRID*TILE/2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 6;
controls.maxDistance = 50;
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a5f0b, 0.45);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff5e1, 0.95);
sun.position.set(25, 35, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 512 : 1024, isMobile ? 512 : 1024);
scene.add(sun);
const terrainGroup = new THREE.Group();
scene.add(terrainGroup);
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);
const natureGroup = new THREE.Group();
scene.add(natureGroup);
const waterGroup = new THREE.Group();
scene.add(waterGroup);
function initRivers() {
  for (let y = 5; y < GRID - 5; y++) {
    const x = Math.floor(GRID / 2) + Math.floor(Math.sin(y * 0.3) * 2);
    if (x >= 0 && x < GRID) riverTiles.add(x + ',' + y);
  }
}
function createTerrain() {
  terrainGroup.clear();
  waterGroup.clear();
  const geo = new THREE.BoxGeometry(TILE, 0.4, TILE);
  const matGrass = new THREE.MeshStandardMaterial({ map: texGrass, roughness: 0.8 });
  const matWater = new THREE.MeshStandardMaterial({ map: texWater, roughness: 0.3, metalness: 0.1, transparent: true, opacity: 0.85 });
  const instGrass = new THREE.InstancedMesh(geo, matGrass, GRID*GRID);
  const instWater = new THREE.InstancedMesh(geo, matWater, riverTiles.size);
  instGrass.receiveShadow = true;
  const dummy = new THREE.Object3D();
  let gi = 0, wi = 0;
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    const isRiver = riverTiles.has(x + ',' + y);
    const h = terrainHeights[y][x];
    const height = isRiver ? 0.15 : 0.4 + Math.abs(h) * 0.3;
    dummy.position.set(x*TILE, height/2, y*TILE);
    dummy.scale.y = height;
    dummy.updateMatrix();
    if (isRiver) {
      instWater.setMatrixAt(wi++, dummy.matrix);
    } else {
      instGrass.setMatrixAt(gi++, dummy.matrix);
    }
  }
  instGrass.instanceMatrix.needsUpdate = true;
  instWater.instanceMatrix.needsUpdate = true;
  terrainGroup.add(instGrass);
  waterGroup.add(instWater);
}
function addNature() {
  natureGroup.clear();
  trees = [];
  rocks = [];
  const treeCount = isMobile ? 35 : 55;
  for (let i = 0; i < treeCount; i++) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    if (riverTiles.has(x + ',' + y) || buildings.some(b => Math.abs(b.x - x) < 1 && Math.abs(b.y - y) < 1)) continue;
    const h = Math.max(0, terrainHeights[y][x] * 0.25);
    const age = 0.6 + Math.random() * 0.5;
    trees.push({ x, y, age, mesh: null });
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12*age, 0.18*age, 1.3*age, 5), new THREE.MeshStandardMaterial({ map: texWood, roughness: 0.85 }));
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.75*age, 6, 5), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.55 }));
    trunk.position.set(x*TILE, h + 0.65*age, y*TILE);
    leaves.position.set(x*TILE, h + 1.5*age, y*TILE);
    trunk.castShadow = leaves.castShadow = !isMobile;
    natureGroup.add(trunk, leaves);
    trees[trees.length-1].mesh = { trunk, leaves };
  }
  for (let i = 0; i < (isMobile ? 12 : 20); i++) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    if (riverTiles.has(x + ',' + y)) continue;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4 + Math.random()*0.3, 0), new THREE.MeshStandardMaterial({ map: texStone, roughness: 0.9 }));
    rock.position.set(x*TILE, 0.3, y*TILE);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    natureGroup.add(rock);
    rocks.push({ x, y, mesh: rock });
  }
}
function createBuilding(type, x, y) {
  const bt = buildingTypes[type];
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ map: type === 'mine' ? texStone : texWood, color: bt.color, roughness: 0.65 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.68, bt.height, TILE*0.68), bodyMat);
  body.position.y = bt.height / 2;
  body.castShadow = body.receiveShadow = !isMobile;
  group.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(TILE*0.48, bt.height * 0.4, 4), new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: 0.7 }));
  roof.position.y = bt.height + 0.15;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = !isMobile;
  group.add(roof);
  group.position.set(x*TILE, Math.max(0, terrainHeights[y][x]*0.25), y*TILE);
  buildingGroup.add(group);
}
function updateUI() {
  ['food','wood','stone','coal','iron','pop','belief','science'].forEach(k => {
    const el = document.getElementById('res-' + k);
    if (el) el.textContent = Math.floor(resources[k] || 0);
  });
}
function log(msg) { document.getElementById('log').textContent = msg; }
function updateBuildMenu() {
  const menu = document.getElementById('build-menu');
  menu.innerHTML = '';
  Object.entries(buildingTypes).forEach(([k, v]) => {
    const btn = document.createElement('button');
    btn.className = 'build-btn' + (selectedBuilding === k ? ' selected' : '');
    btn.textContent = v.name;
    btn.onclick = () => { selectedBuilding = k; updateBuildMenu(); };
    menu.appendChild(btn);
  });
}
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    mode = btn.dataset.mode;
  };
});
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) / rect.width * 2 - 1;
  mouse.y = -(e.clientY - rect.top) / rect.height * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(terrainGroup.children, true);
  if (intersects.length) {
    const p = intersects[0].point;
    const x = Math.round(p.x / TILE);
    const y = Math.round(p.z / TILE);
    if (x >= 0 && x < GRID && y >= 0 && y < GRID) {
      if (mode === 'sculpt-up') { terrainHeights[y][x] = Math.min(4, terrainHeights[y][x] + 1); createTerrain(); addNature(); log('Terén zvýšený'); }
      else if (mode === 'sculpt-down') { terrainHeights[y][x] = Math.max(-2, terrainHeights[y][x] - 1); createTerrain(); addNature(); log('Terén znížený'); }
      else if (mode === 'mine') {
        resources.stone += 3 + Math.random()*2;
        resources.coal += Math.random() > 0.6 ? 1 : 0;
        resources.iron += Math.random() > 0.75 ? 1 : 0;
        log('Vyťažené suroviny');
        updateUI();
      }
      else if (mode === 'build' && selectedBuilding && !buildings.some(b => b.x===x && b.y===y) && !riverTiles.has(x+','+y)) {
        const cost = buildingTypes[selectedBuilding].cost;
        if (resources.wood >= (cost.wood||0) && resources.stone >= (cost.stone||0)) {
          resources.wood -= cost.wood||0; resources.stone -= cost.stone||0;
          buildings.push({ type: selectedBuilding, x, y });
          createBuilding(selectedBuilding, x, y);
          log('Postavené: ' + buildingTypes[selectedBuilding].name);
          updateUI();
        } else log('Nedostatok zdrojov');
      }
    }
  }
});
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
setInterval(() => {
  buildings.forEach(b => {
    const prod = buildingTypes[b.type].prod;
    if (prod) Object.entries(prod).forEach(([k,v]) => resources[k] = (resources[k]||0) + v * 0.4);
  });
  trees.forEach(t => {
    if (t.age < 1.2 && Math.random() > 0.85) {
      t.age += 0.05;
      if (t.mesh) {
        t.mesh.trunk.scale.set(1, t.age, 1);
        t.mesh.leaves.scale.set(t.age, t.age, t.age);
      }
    }
  });
  resources.belief += resources.pop * 0.018;
  resources.science += resources.pop * 0.007;
  if (resources.food > resources.pop * 0.2) resources.food -= resources.pop * 0.045;
  updateUI();
}, 1200);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
initRivers();
createTerrain();
addNature();
updateBuildMenu();
updateUI();
animate();
log('Pridané: ťaženie, rast stromov, rieky, kamene, väčšia mapa!');
</script>
</body>
</html>
