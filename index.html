<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>Epoch Settlers 3D Textúry</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0a0a1a; color: #eee; overflow: hidden; height: 100dvh; touch-action: none; }
#ui { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; z-index: 10; }
#top-bar { background: rgba(22,33,62,0.92); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; pointer-events: auto; }
.resource { background: #0f3460; padding: 4px 8px; border-radius: 10px; }
.resource span { font-weight: bold; color: #ffd166; }
#bottom-ui { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(22,33,62,0.96); padding: 8px; max-height: 32vh; overflow-y: auto; pointer-events: auto; }
.mode-btn, .build-btn, .ctrl { background: #0f3460; border: 1px solid #e94560; color: white; padding: 8px 10px; border-radius: 6px; font-size: 13px; margin: 2px; min-height: 40px; }
.mode-btn.selected { background: #e94560; }
#canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="ui">
  <div id="top-bar">
    <div class="resource">🍞 <span id="res-food">80</span></div>
    <div class="resource">🪵 <span id="res-wood">40</span></div>
    <div class="resource">🪨 <span id="res-stone">25</span></div>
    <div class="resource">👥 <span id="res-pop">6</span></div>
    <div class="resource">🙏 <span id="res-belief">30</span></div>
    <div class="resource">🔬 <span id="res-science">0</span></div>
  </div>
  <div id="bottom-ui">
    <div id="modes">
      <button class="mode-btn selected" data-mode="build">🏗️ Stavanie</button>
      <button class="mode-btn" data-mode="sculpt-up">⬆️ Zvýšiť</button>
      <button class="mode-btn" data-mode="sculpt-down">⬇️ Znížiť</button>
    </div>
    <div id="build-menu"></div>
    <div id="log"></div>
  </div>
</div>
<div id="canvas-container"></div>
<script>
function makeTexture(color, noise = 20, size = 64) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < noise; i++) {
    ctx.fillStyle = `rgba(${Math.random()*50|0},${Math.random()*50|0},${Math.random()*50|0},${Math.random()*0.3})`;
    ctx.fillRect(Math.random()*size, Math.random()*size, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}
const texGrass = makeTexture('#4a7c3a', 40);
const texDirt = makeTexture('#6b4f3a', 30);
const texWood = makeTexture('#8d6e63', 25);
const texStone = makeTexture('#78909c', 35);
const GRID = 18, TILE = 2;
let mode = 'build', selectedBuilding = 'hut';
let resources = { food: 80, wood: 40, stone: 25, pop: 6, belief: 30, science: 0 };
let terrainHeights = Array.from({length: GRID}, () => Array(GRID).fill(0));
let buildings = [];
const buildingTypes = {
  hut: { name: "Chata", cost: { wood: 10, stone: 5 }, prod: { food: 1 }, height: 1.2, color: 0x8d6e63, mat: 'wood' },
  farm: { name: "Farma", cost: { wood: 12, stone: 6 }, prod: { food: 3.5 }, height: 1, color: 0x66bb6a, mat: 'wood' },
  house: { name: "Dom", cost: { wood: 15, stone: 10 }, prod: { pop: 2 }, height: 1.8, color: 0xffcc80, mat: 'wood' },
  mine: { name: "Baňa", cost: { wood: 8, stone: 15 }, prod: { stone: 2 }, height: 1.5, color: 0x78909c, mat: 'stone' }
};
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 90);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(GRID*TILE/2, 16, GRID*TILE/2 + 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(GRID*TILE/2, 0, GRID*TILE/2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
const ambient = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a5f0b, 0.45);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff5e1, 1.0);
sun.position.set(18, 28, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);
const terrainGroup = new THREE.Group();
scene.add(terrainGroup);
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);
const natureGroup = new THREE.Group();
scene.add(natureGroup);
function createTerrain() {
  terrainGroup.clear();
  const geo = new THREE.BoxGeometry(TILE, 0.5, TILE);
  const mat = new THREE.MeshStandardMaterial({ map: texGrass, roughness: 0.85, metalness: 0.02 });
  const inst = new THREE.InstancedMesh(geo, mat, GRID*GRID);
  inst.receiveShadow = true;
  const dummy = new THREE.Object3D();
  let i = 0;
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    const h = terrainHeights[y][x];
    const height = 0.5 + Math.abs(h) * 0.35;
    dummy.position.set(x*TILE, height/2, y*TILE);
    dummy.scale.y = height;
    dummy.updateMatrix();
    inst.setMatrixAt(i++, dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  terrainGroup.add(inst);
}
function addNature() {
  natureGroup.clear();
  for (let i = 0; i < 30; i++) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    if (buildings.some(b => b.x === x && b.y === y)) continue;
    const h = Math.max(0, terrainHeights[y][x] * 0.35);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 1.1, 6), new THREE.MeshStandardMaterial({ map: texWood, roughness: 0.9 }));
    const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.65, 8, 6), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.65 }));
    trunk.position.set(x*TILE, h + 0.55, y*TILE);
    leaves.position.set(x*TILE, h + 1.4, y*TILE);
    trunk.castShadow = leaves.castShadow = true;
    natureGroup.add(trunk, leaves);
  }
}
function createBuilding(type, x, y) {
  const bt = buildingTypes[type];
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ map: bt.mat === 'stone' ? texStone : texWood, color: bt.color, roughness: 0.7 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.72, bt.height, TILE*0.72), bodyMat);
  body.position.y = bt.height / 2;
  body.castShadow = body.receiveShadow = true;
  group.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(TILE*0.48, bt.height * 0.35, 4), new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.75 }));
  roof.position.y = bt.height + 0.12;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true;
  group.add(roof);
  group.position.set(x*TILE, Math.max(0, terrainHeights[y][x]*0.25), y*TILE);
  buildingGroup.add(group);
}
function updateUI() {
  ['food','wood','stone','pop','belief','science'].forEach(k => {
    const el = document.getElementById('res-' + k);
    if (el) el.textContent = Math.floor(resources[k] || 0);
  });
}
function log(msg) { document.getElementById('log').textContent = msg; }
function updateBuildMenu() {
  const menu = document.getElementById('build-menu');
  menu.innerHTML = '';
  Object.entries(buildingTypes).forEach(([k, v]) => {
    const btn = document.createElement('button');
    btn.className = 'build-btn' + (selectedBuilding === k ? ' selected' : '');
    btn.textContent = v.name;
    btn.onclick = () => { selectedBuilding = k; updateBuildMenu(); };
    menu.appendChild(btn);
  });
}
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    mode = btn.dataset.mode;
  };
});
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) / rect.width * 2 - 1;
  mouse.y = -(e.clientY - rect.top) / rect.height * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(terrainGroup.children, true);
  if (intersects.length) {
    const p = intersects[0].point;
    const x = Math.round(p.x / TILE);
    const y = Math.round(p.z / TILE);
    if (x >= 0 && x < GRID && y >= 0 && y < GRID) {
      if (mode === 'sculpt-up') { terrainHeights[y][x] = Math.min(4, terrainHeights[y][x] + 1); createTerrain(); addNature(); log('Terén zvýšený'); }
      else if (mode === 'sculpt-down') { terrainHeights[y][x] = Math.max(-2, terrainHeights[y][x] - 1); createTerrain(); addNature(); log('Terén znížený'); }
      else if (mode === 'build' && selectedBuilding && !buildings.some(b => b.x===x && b.y===y)) {
        const cost = buildingTypes[selectedBuilding].cost;
        if (resources.wood >= (cost.wood||0) && resources.stone >= (cost.stone||0)) {
          resources.wood -= cost.wood||0; resources.stone -= cost.stone||0;
          buildings.push({ type: selectedBuilding, x, y });
          createBuilding(selectedBuilding, x, y);
          log('Postavené: ' + buildingTypes[selectedBuilding].name);
          updateUI();
        } else log('Nedostatok zdrojov');
      }
    }
  }
});
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
setInterval(() => {
  buildings.forEach(b => {
    const prod = buildingTypes[b.type].prod;
    if (prod) Object.entries(prod).forEach(([k,v]) => resources[k] = (resources[k]||0) + v * 0.45);
  });
  resources.belief += resources.pop * 0.03;
  resources.science += resources.pop * 0.012;
  if (resources.food > resources.pop * 0.4) resources.food -= resources.pop * 0.07;
  updateUI();
}, 1100);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
createTerrain();
addNature();
updateBuildMenu();
updateUI();
animate();
log('Textúrovaná 3D verzia pripravená! Otáčaj, sculptuj, stavaj.');
</script>
</body>
</html>
