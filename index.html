<script>
const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
const GRID = isMobile ? 28 : 45, TILE = 2;
let mode = 'build', selectedBuilding = 'townhall';
let era = 0;
const eras = ['Pravek', 'Doba kamenná', 'Doba bronzová'];
// ERA_REQS[i]: values that must be EXCEEDED (>) to advance from era i to era i+1.
const ERA_REQS = [{ belief: 150, science: 20 }, { belief: 300, science: 60, iron: 20 }];
const REQ_ICONS = { belief: '🙏', science: '🔬', iron: '⚙️' };
function eraReqMet(e) { return Object.entries(ERA_REQS[e] || {}).every(([k, v]) => (resources[k] || 0) > v); }
function nextEraText() {
  if (era >= eras.length - 1) return '🏆 Dosiahnutá posledná éra';
  return 'Ďalšia éra (' + eras[era + 1] + '): ' + Object.entries(ERA_REQS[era]).map(([k, v]) => {
    const have = resources[k] || 0, met = have > v;
    // Rule is have > v; shown target is v+1, so round up when met (300.4 -> 301/301 ✅, not 300/301 ✅).
    return REQ_ICONS[k] + ' ' + (met ? Math.ceil(have) : Math.floor(have)) + '/' + (v + 1) + (met ? ' ✅' : ' ❌');
  }).join('  ');
}
let resources = { food: 200, bread: 0, wood: 150, planks: 0, stone: 100, tools: 0, water: 50, coal: 0, iron: 0, pop: 12, happiness: 70, belief: 70, science: 0, gold: 0 };
let stats = { produced: 0, maxPop: 12, time: 0 };
let terrainHeights = Array.from({length: GRID}, () => Array(GRID).fill(0));
let buildings = [];
let trees = [];
let rocks = [];
let settlers = [];
let animals = [];
let riverTiles = new Set();
let roadTiles = new Set();
let seed = Math.random() * 10000;
let weather = 'clear';
let weatherDuration = 30;
let weatherTimer = 0;
const weatherTypes = {
  clear: { name: 'Jasno', icon: '☀️', bg: 0x64b5f6, ambient: 0.65, water: 0, speed: 1, happiness: 0 },
  rain: { name: 'Dážď', icon: '🌧️', bg: 0x546e7a, ambient: 0.45, water: 0.8, speed: 0.8, happiness: -0.2 },
  storm: { name: 'Búrka', icon: '⛈️', bg: 0x37474f, ambient: 0.3, water: 1.2, speed: 0.5, happiness: -0.5 },
  fog: { name: 'Hmla', icon: '🌫️', bg: 0x90a4ae, ambient: 0.4, water: 0.2, speed: 0.7, happiness: -0.1 },
  snow: { name: 'Sneh', icon: '❄️', bg: 0xb0bec5, ambient: 0.55, water: 0.3, speed: 0.6, happiness: -0.3 }
};
let dayTime = 0;
let animTime = 0;
let particles = [];
let quests = [
  { id: 1, name: 'Postav farmu', type: 'build', target: 'farm', done: false, reward: { food: 20 } },
  { id: 2, name: 'Získaj 50 dreva', type: 'resource', target: 'wood', amount: 50, done: false, reward: { gold: 5 } },
  { id: 3, name: 'Postav drevorubača', type: 'build', target: 'lumberjack', done: false, reward: { wood: 30 } }
];
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur, type = 'sine') {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function makeTexture(color, type) {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const textures = {
  wood: makeTexture('#8d6e63', 'wood'),
  stone: makeTexture('#78909c', 'stone'),
  roof: makeTexture('#3e2723', 'roof'),
  grass: makeTexture('#4caf50', 'grass'),
  farm: makeTexture('#66bb6a', 'grass'),
  mine: makeTexture('#546e7a', 'stone'),
  ironmine: makeTexture('#8d4e2a', 'stone'),
  townhall: makeTexture('#6d4c41', 'stone')
};
const buildingTypes = {
  townhall: { name: "Radnica", cost: { wood: 20, stone: 15 }, prod: { belief: 2, science: 0.5, gold: 0.3 }, height: 2.8, tex: textures.townhall, era: 0 },
  hut: { name: "Chata", cost: { wood: 6, stone: 3 }, prod: { food: 0.5 }, height: 1.2, tex: textures.wood, era: 0 },
  farm: { name: "Farma", cost: { wood: 8, stone: 4 }, prod: { food: 2.5 }, height: 1.0, tex: textures.farm, era: 0 },
  house: { name: "Dom", cost: { wood: 10, stone: 6 }, prod: { pop: 2 }, height: 1.8, tex: textures.wood, era: 0 },
  mine: { name: "Baňa", cost: { wood: 5, stone: 10 }, prod: { stone: 1.2, coal: 0.3 }, height: 1.4, tex: textures.mine, era: 0 },
  well: { name: "Studňa", cost: { wood: 4, stone: 8 }, prod: { water: 2 }, height: 1.0, tex: textures.stone, era: 0 },
  lumberjack: { name: "Drevorubač", cost: { wood: 10, stone: 5 }, prod: { wood: 1.8 }, height: 1.5, tex: textures.wood, era: 0 },
  forester: { name: "Lesník", cost: { wood: 8, stone: 4 }, prod: {}, height: 1.4, tex: textures.wood, era: 0 },
  bakery: { name: "Pekáreň", cost: { wood: 12, stone: 6 }, prod: { bread: 1.5 }, consume: { food: 1 }, height: 1.6, tex: textures.wood, era: 1 },
  lumber: { name: "Drevár", cost: { wood: 10, stone: 4 }, prod: { planks: 1 }, consume: { wood: 1.5 }, height: 1.5, tex: textures.wood, era: 1 },
  ironmine: { name: "Železná baňa", cost: { wood: 15, stone: 20 }, prod: { iron: 1, coal: 0.2 }, height: 1.5, tex: textures.ironmine, era: 1 },
  smith: { name: "Kováč", cost: { wood: 8, stone: 12 }, prod: { tools: 0.8 }, consume: { iron: 0.5, coal: 0.3 }, height: 1.7, tex: textures.stone, era: 2 },
  church: { name: "Kostol", cost: { wood: 15, stone: 12 }, prod: { belief: 1.5, science: 0.3 }, height: 2.5, tex: textures.stone, era: 1 },
  storage: { name: "Sklad", cost: { wood: 8, stone: 8 }, prod: {}, height: 1.3, tex: textures.wood, era: 0 },
  bridge: { name: "Most", cost: { wood: 8, stone: 6 }, prod: {}, height: 0.4, tex: textures.wood, era: 0 }
};
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x64b5f6);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 300);
camera.position.set(GRID*TILE/2, 20, GRID*TILE/2 + 12);
camera.lookAt(GRID*TILE/2, 0, GRID*TILE/2);
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.setClearColor(0x64b5f6);
document.getElementById('canvas-container').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(GRID*TILE/2, 0, GRID*TILE/2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.3;
controls.minDistance = 5;
controls.maxDistance = 70;
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(10, 20, 8);
scene.add(sun);
const terrainGroup = new THREE.Group();
scene.add(terrainGroup);
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);
const natureGroup = new THREE.Group();
scene.add(natureGroup);
const roadGroup = new THREE.Group();
scene.add(roadGroup);
const settlerGroup = new THREE.Group();
scene.add(settlerGroup);
const animalGroup = new THREE.Group();
scene.add(animalGroup);
const particleGroup = new THREE.Group();
scene.add(particleGroup);
const weatherGroup = new THREE.Group();
scene.add(weatherGroup);
let weatherParticles = [];
let terrainMesh = null;
function noise(x, y) {
  const n = Math.sin(x * 0.15 + seed) * Math.cos(y * 0.13 + seed * 0.7);
  const n2 = Math.sin(x * 0.4 + seed * 1.3) * Math.cos(y * 0.35 + seed);
  return (n + n2 * 0.5 + 1.2) * 0.35;
}
function generateTerrain() {
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      let h = noise(x * 0.1, y * 0.1) * 3;
      h += noise(x * 0.25, y * 0.25) * 1.2;
      terrainHeights[y][x] = Math.max(0, h);
    }
  }
  // Normalize heights to a fixed 0..2.3 range so every seed gets grass + trees
  // (raw noise varies too slowly across the map; ~1/3 of seeds were almost all brown with no trees)
  let minH = Infinity, maxH = -Infinity;
  terrainHeights.forEach(row => row.forEach(h => { minH = Math.min(minH, h); maxH = Math.max(maxH, h); }));
  const hScale = maxH - minH > 0.01 ? 2.3 / (maxH - minH) : 1;
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) terrainHeights[y][x] = (terrainHeights[y][x] - minH) * hScale;
  for (let y = 2; y < GRID - 2; y++) {
    const x = Math.floor(GRID / 2) + Math.floor(Math.sin(y * 0.12 + seed) * 3);
    if (x >= 0 && x < GRID) {
      riverTiles.add(x + ',' + y);
      terrainHeights[y][x] = 0;
      if (x+1 < GRID) { riverTiles.add((x+1) + ',' + y); terrainHeights[y][x+1] = 0; }
    }
  }
}
function createTerrain() {
  while (terrainGroup.children.length) terrainGroup.remove(terrainGroup.children[0]);
  // GRID x GRID vertices spaced exactly TILE apart, vertex (x,z) at world (x*TILE, z*TILE) = tile (x,z).
  // (Was GRID*TILE wide: spacing GRID*TILE/(GRID-1) skipped the centre row/column and sampled tile GRID at the edge.)
  const SPAN = (GRID - 1) * TILE;
  const geo = new THREE.PlaneGeometry(SPAN, SPAN, GRID - 1, GRID - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = [];
  for (let i = 0; i < pos.count; i++) {
    const x = Math.round((pos.getX(i) + SPAN / 2) / TILE);
    const z = Math.round((pos.getZ(i) + SPAN / 2) / TILE);
    const h = (terrainHeights[z] && terrainHeights[z][x]) || 0;
    const isRiver = riverTiles.has(x + ',' + z);
    pos.setY(i, isRiver ? 0.05 : h * 0.5);
    if (isRiver) colors.push(0.13, 0.59, 0.95);
    else if (h > 2) colors.push(0.55, 0.43, 0.39);
    else if (h < 0.4) colors.push(0.51, 0.78, 0.52);
    else colors.push(0.3, 0.69, 0.31);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  terrainMesh = new THREE.Mesh(geo, mat);
  terrainMesh.position.set(SPAN / 2, 0, SPAN / 2);
  terrainGroup.add(terrainMesh);
}
function createRoads() {
  while (roadGroup.children.length) roadGroup.remove(roadGroup.children[0]);
  const geo = new THREE.PlaneGeometry(TILE * 0.5, TILE * 0.5);
  geo.rotateX(-Math.PI / 2);
  const matRoad = new THREE.MeshLambertMaterial({ color: 0x6d4c41 });
  roadTiles.forEach(key => {
    const [x, y] = key.split(',').map(Number);
    const mesh = new THREE.Mesh(geo, matRoad);
    mesh.position.set(x*TILE, (terrainHeights[y][x]||0)*0.5 + 0.05, y*TILE);
    roadGroup.add(mesh);
  });
}
// Remove only the trees/rocks on one tile (used when a road or building is placed there).
function clearNatureAt(x, y) {
  trees.filter(t => t.x === x && t.y === y).forEach(t => { if (t.mesh) natureGroup.remove(t.mesh.trunk, t.mesh.leaves); });
  trees = trees.filter(t => !(t.x === x && t.y === y));
  rocks.filter(r => r.x === x && r.y === y).forEach(r => natureGroup.remove(r.mesh));
  rocks = rocks.filter(r => !(r.x === x && r.y === y));
}
// After sculpting tile (x,y) from height h0, move the building/trees/rocks/road on it to the new ground level.
function syncTileHeight(x, y, h0) {
  const dy = (terrainHeights[y][x] - h0) * 0.5;
  if (!dy) return;
  buildingGroup.children.forEach(g => { if (g.userData.x === x && g.userData.y === y) g.position.y += dy; });
  trees.forEach(t => { if (t.x === x && t.y === y && t.mesh) { t.mesh.trunk.position.y += dy; t.mesh.leaves.position.y += dy; } });
  rocks.forEach(r => { if (r.x === x && r.y === y) r.mesh.position.y += dy; });
  if (roadTiles.has(x + ',' + y)) createRoads();
}
const TREE_TYPES = {
  dub: { leafColor: 0x2e7d32, trunkH: 1.2, leafR: 0.6 },
  borovica: { leafColor: 0x1b5e20, trunkH: 1.8, leafR: 0.4 },
  breza: { leafColor: 0x66bb6a, trunkH: 1.0, leafR: 0.5 }
};
// Build (and add to the scene) the mesh for a tree record {x, y, age, a0, type, planted}.
function makeTreeMesh(t) {
  const baseY = terrainHeights[t.y][t.x] * 0.5;
  let trunk, leaves;
  if (t.planted) {
    trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.4, 4), new THREE.MeshLambertMaterial({ color: 0x5d4037 }));
    leaves = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.4, 5), new THREE.MeshLambertMaterial({ color: 0x4caf50 }));
    trunk.position.set(t.x*TILE, baseY + 0.25, t.y*TILE);
    leaves.position.set(t.x*TILE, baseY + 0.55, t.y*TILE);
  } else {
    const type = TREE_TYPES[t.type] || TREE_TYPES.dub, a = t.a0 || t.age;
    trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1*a, 0.14*a, type.trunkH*a, 5), new THREE.MeshLambertMaterial({ color: t.type === 'breza' ? 0xe0e0e0 : 0x5d4037 }));
    leaves = new THREE.Mesh(new THREE.ConeGeometry(type.leafR*a, type.trunkH*0.8*a, 6), new THREE.MeshLambertMaterial({ color: type.leafColor }));
    trunk.position.set(t.x*TILE, baseY + type.trunkH*a/2, t.y*TILE);
    leaves.position.set(t.x*TILE, baseY + type.trunkH*a + 0.2, t.y*TILE);
  }
  natureGroup.add(trunk, leaves);
  // offsets above ground at the size the geometry was built for; growth scales around the ground point
  const mesh = { trunk, leaves, trunkOff: trunk.position.y - baseY, leavesOff: leaves.position.y - baseY };
  applyTreeGrowth(t, mesh);
  return mesh;
}
// Geometry is built for age a0, so growth scales by age/a0 and keeps the trunk on the ground.
function applyTreeGrowth(t, mesh = t.mesh) {
  if (!mesh || mesh.trunkOff === undefined) return;
  const s = t.a0 ? t.age / t.a0 : 1, baseY = terrainHeights[t.y][t.x] * 0.5;
  mesh.trunk.scale.set(1, s, 1);

function makeRockMesh(r) {

function restoreNature(data) {

  trees = data.trees.map(t => { const n = { ...t }; n.mesh = makeTreeMesh(n); return n; });
  rocks = (data.rocks || []).map(r => { const n = { ...r }; n.mesh = makeRockMesh(n); return n; });

}
function addNature() {

function updateAnimals() {

      const tx = Math.max(0, Math.min(GRID-1, a.x + (Math.random()-0.5)*3));
      const ty = Math.max(0, Math.min(GRID-1, a.y + (Math.random()-0.5)*3));
      if (!riverTiles.has(Math.round(tx) + ',' + Math.round(ty))) { a.targetX = tx; a.targetY = ty; } // animals don't wander into the river
    }
    const dx = a.targetX - a.x;
    const dy = a.targetY - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

      if (riverTiles.has(Math.round(nx) + ',' + Math.round(ny))) { a.targetX = a.x; a.targetY = a.y; } // path crosses water: stop at the bank
      else { a.x = nx; a.y = ny; }
    }
    if (a.mesh) {
      const baseY = (terrainHeights[Math.round(a.y)] || [])[Math.round(a.x)] * 0.5 || 0;

function randomLandTile() {

    if (!riverTiles.has(x + ',' + y)) return [x, y];
  }
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) if (!riverTiles.has(x + ',' + y)) return [x, y];

}

  }

function findPath(sx, sy, tx, ty) {
  if (roadTiles.has(Math.round(tx)+','+Math.round(ty))) return [{x: tx, y: ty}];
  const roads = [...roadTiles].map(k => k.split(',').map(Number));
  if (roads.length === 0) return [{x: tx, y: ty}];
  let closest = roads[0];
  let minDist = Infinity;
  roads.forEach(([rx, ry]) => {
    const d = Math.abs(rx - tx) + Math.abs(ry - ty);
    if (d < minDist) { minDist = d; closest = [rx, ry]; }
  });
  return [{x: closest[0], y: closest[1]}, {x: tx, y: ty}];
}
function findWork(s) {
  const foresters = buildings.filter(b => b.type === 'forester');
  if (foresters.length && Math.random() > 0.5) {
    const f = foresters[Math.floor(Math.random() * foresters.length)];
    for (let i = 0; i < 4; i++) {
      const px = Math.max(0, Math.min(GRID-1, f.x + Math.floor((Math.random()-0.5)*4)));
      const py = Math.max(0, Math.min(GRID-1, f.y + Math.floor((Math.random()-0.5)*4)));
      if (!riverTiles.has(px+','+py) && !roadTiles.has(px+','+py) && !buildings.some(b => b.x===px && b.y===py) && !trees.some(t => t.x===px && t.y===py)) {
        s.path = findPath(s.x, s.y, px, py);
        s.targetX = px;
        s.targetY = py;
        s.job = 'plant';
        return;
      }
    }
  }
  const lumberjacks = buildings.filter(b => b.type === 'lumberjack');
  if (lumberjacks.length && trees.length && Math.random() > 0.4) {
    const lj = lumberjacks[Math.floor(Math.random() * lumberjacks.length)];
    const nearby = trees.filter(t => Math.abs(t.x - lj.x) + Math.abs(t.y - lj.y) < 5);
    if (nearby.length) {
      const t = nearby[Math.floor(Math.random() * nearby.length)];
      s.path = findPath(s.x, s.y, t.x, t.y);
      s.targetX = t.x;
      s.targetY = t.y;
      s.job = 'chop';
      s.chopTarget = t;
      return;
    }
  }
  const works = buildings.filter(b => ['farm','mine','ironmine','bakery','lumber','smith'].includes(b.type));
  if (works.length && Math.random() > 0.35) {
    const w = works[Math.floor(Math.random() * works.length)];
    s.path = findPath(s.x, s.y, w.x, w.y);
    s.targetX = w.x;
    s.targetY = w.y;
    s.job = 'work';
    return;
  }
  s.targetX = Math.max(0, Math.min(GRID-1, s.x + (Math.random()-0.5)*3));
  s.targetY = Math.max(0, Math.min(GRID-1, s.y + (Math.random()-0.5)*3));
  s.job = 'idle';
}

function updateWeatherParticles() {

  }

    if (weather === 'snow') wp.mesh.position.x += Math.sin(animTime + wp.mesh.position.z) * 0.012;

  });
}
function updateSettlers() {
  const speedMult = weatherTypes[weather].speed;
  settlers.forEach(s => {
    if (Math.random() > 0.91) findWork(s);
    if (s.path && s.path.length > 0) {
      const next = s.path[0];
      const dx = next.x - s.x;
      const dy = next.y - s.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 0.4) s.path.shift();
      else {
        const speed = (s.onRoad ? 0.06 : 0.03) * speedMult;
        s.x += (dx / dist) * speed * 5;
        s.y += (dy / dist) * speed * 5;
      }
    } else {
      const dx = s.targetX - s.x;
      const dy = s.targetY - s.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const speed = (s.onRoad ? 0.04 : 0.02) * (s.job === 'chop' || s.job === 'work' || s.job === 'plant' ? 1.3 : 1) * speedMult;
      if (dist > 0.3) {
        s.x += (dx / dist) * speed * 5;
        s.y += (dy / dist) * speed * 5;
      }
    }
    s.onRoad = roadTiles.has(Math.round(s.x) + ',' + Math.round(s.y));
    if (s.mesh) {
      const baseY = (terrainHeights[Math.round(s.y)] || [])[Math.round(s.x)] * 0.5 || 0;
      const bob = Math.sin(animTime * 10 + s.animOffset) * 0.04;
      s.mesh.body.position.set(s.x*TILE, baseY + 0.3 + bob, s.y*TILE);
      s.mesh.head.position.set(s.x*TILE, baseY + 0.6 + bob, s.y*TILE);
      if (s.job === 'chop' || s.job === 'work' || s.job === 'plant') {
        s.mesh.body.rotation.z = Math.sin(animTime * 15 + s.animOffset) * 0.15;
      } else {
        s.mesh.body.rotation.z = 0;
      }
    }
    // The target tree may already be gone (felled by another settler or cleared by a building).
    if (s.job === 'chop' && s.chopTarget && !trees.includes(s.chopTarget)) { s.chopTarget = null; s.job = 'idle'; }
    if (s.job === 'chop' && s.chopTarget && Math.abs(s.x - s.chopTarget.x) < 0.5 && Math.abs(s.y - s.chopTarget.y) < 0.5 && Math.random() > 0.92) {
      resources.wood += 3 + Math.random()*2;
      stats.produced += 3;
      showFeedback(s.x*TILE, '+3 🪵');
      spawnParticle(s.chopTarget.x, s.chopTarget.y, 0x5d4037);
      playSound(180, 0.15, 'sawtooth');
      if (s.chopTarget.mesh) {
        natureGroup.remove(s.chopTarget.mesh.trunk);
        natureGroup.remove(s.chopTarget.mesh.leaves);
      }
      trees = trees.filter(t => t !== s.chopTarget);
      s.chopTarget = null;
      s.job = 'idle';
    }
    if (s.job === 'plant' && Math.abs(s.x - s.targetX) < 0.5 && Math.abs(s.y - s.targetY) < 0.5 && Math.random() > 0.93) {
      const px = Math.round(s.x);
      const py = Math.round(s.y);
      // Re-check: a road/building may have been placed on the spot while the settler walked there.
      if (!trees.some(t => t.x===px && t.y===py) && !riverTiles.has(px+','+py) && !roadTiles.has(px+','+py) && !buildings.some(b => b.x===px && b.y===py)) {
        plantTree(px, py);
        showFeedback(s.x*TILE, '🌱');
      }
      s.job = 'idle';
    }
    if (s.job === 'work' && Math.abs(s.x - s.targetX) < 0.5 && Math.abs(s.y - s.targetY) < 0.5 && Math.random() > 0.94) {
      resources.food += 0.2;
      resources.wood += 0.1;
      spawnParticle(s.x, s.y, 0xffeb3b);
    }
  });
  particles = particles.filter(p => {
    p.life -= 0.02;
    p.mesh.position.x += p.vx * 0.05;
    p.mesh.position.y += p.vy * 0.05;
    p.mesh.position.z += p.vz * 0.05;
    p.vy -= 0.05;
    if (p.life <= 0) {
      particleGroup.remove(p.mesh);
      return false;
    }
    return true;
  });
}
function updateMinimap() {

  const w = mm.width = 80;
  const h = mm.height = 80;
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, w, h);
  const scale = w / GRID;
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      if (riverTiles.has(x+','+y)) ctx.fillStyle = '#2196f3';
      else if (roadTiles.has(x+','+y)) ctx.fillStyle = '#6d4c41';
      else if (terrainHeights[y][x] > 2) ctx.fillStyle = '#8d6e63';
      else ctx.fillStyle = '#4caf50';
      ctx.fillRect(x*scale, y*scale, scale, scale);
    }
  }
  buildings.forEach(b => {
    ctx.fillStyle = b.type === 'townhall' ? '#e94560' : b.type === 'ironmine' ? '#ff7043' : '#ffd166';
    ctx.fillRect(b.x*scale, b.y*scale, scale*1.5, scale*1.5);
  });

    ctx.fillRect(s.x*scale, s.y*scale, 2, 2);
  });

function updateQuests() {

    if (q.done) return;

      const has = buildings.some(b => b.type === q.target);

    smoke.position.y = height + 0.4;

function tryAutoRoad(x, y) {
  const neighbors = [[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
  for (const [nx, ny] of neighbors) {
    if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID && !riverTiles.has(nx+','+ny) && !roadTiles.has(nx+','+ny) && !buildings.some(b => b.x===nx && b.y===ny) && resources.stone >= 2) {
      resources.stone -= 2;
      roadTiles.add(nx + ',' + ny);
      createRoads();
      clearNatureAt(nx, ny);
      return;
    }
  }
}

function missingText(cost) {
  const miss = [];
  if (resources.wood < (cost.wood||0)) miss.push(Math.ceil((cost.wood||0) - resources.wood) + ' dreva');
  if (resources.stone < (cost.stone||0)) miss.push(Math.ceil((cost.stone||0) - resources.stone) + ' kameňa');
  return miss.length ? 'Chýba: ' + miss.join(', ') : '';
}
function updateBuildMenu() {
  const menu = document.getElementById('build-menu');
  menu.innerHTML = '';
  Object.entries(buildingTypes).forEach(([k, v]) => {
    if (v.era > era + 1) return;
    const locked = v.era > era;
    const btn = document.createElement('button');
    btn.className = 'build-btn' + (selectedBuilding === k && !locked ? ' selected' : '') + (locked ? ' locked' : '');
    btn.dataset.type = k;
    btn.innerHTML = v.name + '<span class="cost">' + (locked ? '🔒 ' + eras[v.era] : costText(v.cost)) + '</span>';
    btn.onclick = () => {
      if (locked) { log(v.name + ': vyžaduje éru ' + eras[v.era]); return; }
      selectedBuilding = k;
      setMode('build'); // picking a building always switches to build mode (was stuck in upgrade/info mode)
      updateBuildMenu();
      const miss = missingText(v.cost);
      log(v.name + ' (' + costText(v.cost) + ')' + (miss ? ' – ' + miss : ' – klikni na mapu'));
    };
    menu.appendChild(btn);
  });
  refreshBuildButtons();
}
// Mark build buttons the player cannot afford right now (called every UI tick).
function refreshBuildButtons() {
  document.querySelectorAll('#build-menu .build-btn').forEach(btn => {
    const v = buildingTypes[btn.dataset.type];
    if (v) btn.classList.toggle('unaffordable', !!missingText(v.cost));
  });
}
function showUpgradeMenu(building) {
  const menu = document.getElementById('upgrade-menu');
  menu.innerHTML = '';
  menu.style.display = 'flex';
  const level = building.level || 1;
  const costWood = 15 * level;
  const costStone = 12 * level;
  const btn = document.createElement('button');
  btn.className = 'upgrade-btn';
  btn.textContent = 'Upgrade Radnice na úroveň ' + (level+1) + ' (' + costWood + '🪵 ' + costStone + '🪨)';
  btn.onclick = () => {
    if (resources.wood >= costWood && resources.stone >= costStone) {
      resources.wood -= costWood;
      resources.stone -= costStone;
      building.level = level + 1;
      while (buildingGroup.children.length) buildingGroup.remove(buildingGroup.children[0]);
      buildings.forEach(b => createBuilding(b.type, b.x, b.y, b.level || 1));
      log('Radnica vylepšená na úroveň ' + building.level + '!');
      playSound(660, 0.2);
      updateUI();
      menu.style.display = 'none';
    } else {
      log('Nedostatok zdrojov na upgrade');
    }
  };
  menu.appendChild(btn);
}
function updateTradeMenu() {
  const menu = document.getElementById('trade-menu');
  menu.innerHTML = '';
  const trades = [
    { name: 'Predaj jedlo +5', res: 'food', amount: 20, gold: 5 },
    { name: 'Predaj drevo +4', res: 'wood', amount: 15, gold: 4 },
    { name: 'Kúp jedlo -8', res: 'food', amount: -25, gold: -8 },
    { name: 'Kúp drevo -6', res: 'wood', amount: -20, gold: -6 },
    { name: 'Kúp kameň -5', res: 'stone', amount: -15, gold: -5 }
  ];
  trades.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'trade-btn';
    btn.textContent = t.name;
    btn.onclick = () => {
      if (t.gold > 0 && resources[t.res] >= t.amount) {
        resources[t.res] -= t.amount;
        resources.gold += t.gold;
        log('Predané!');
        playSound(520, 0.1);
      } else if (t.gold < 0 && resources.gold >= -t.gold) {
        resources.gold += t.gold;
        resources[t.res] = (resources[t.res]||0) - t.amount;
        log('Kúpené!');
        playSound(480, 0.1);
      } else log('Nedostatok zdrojov');
      updateUI();
    };
    menu.appendChild(btn);
  });
}
function saveGame(slot, silent = false) {
  const data = {
    resources, buildings, roadTiles: [...roadTiles], riverTiles: [...riverTiles],
    terrainHeights, seed, era, stats, weather, dayTime, quests,
    trees: trees.map(t => ({ x: t.x, y: t.y, age: t.age, a0: t.a0, type: t.type, planted: t.planted })),
    rocks: rocks.map(r => ({ x: r.x, y: r.y, r: r.r }))
  };
  localStorage.setItem('epochSave' + slot, JSON.stringify(data));
  if (silent) return;
  log('Uložené do slotu ' + slot);
  playSound(600, 0.15);
}
function loadGame(slot) {
  const raw = localStorage.getItem('epochSave' + slot);
  const slotName = slot === 'Auto' ? 'z automatického uloženia' : 'zo slotu ' + slot;
  if (!raw) { log(slot === 'Auto' ? 'Automatické uloženie je prázdne' : 'Slot ' + slot + ' je prázdny'); return; }
  try {
    const data = JSON.parse(raw);
    resources = data.resources;
    buildings = data.buildings || [];
    roadTiles = new Set(data.roadTiles || []);
    riverTiles = new Set(data.riverTiles || []);
    terrainHeights = data.terrainHeights || terrainHeights;
    riverTiles.forEach(k => { const [rx, ry] = k.split(',').map(Number); if (terrainHeights[ry]) terrainHeights[ry][rx] = 0; }); // heal saves with sculpted river tiles
    seed = data.seed || seed;
    era = data.era || 0;
    stats = data.stats || stats;
    weather = data.weather || 'clear';
    dayTime = data.dayTime || 0;
    quests = data.quests || quests;
    while (buildingGroup.children.length) buildingGroup.remove(buildingGroup.children[0]);
    buildings.forEach(b => createBuilding(b.type, b.x, b.y, b.level || 1));
    createTerrain();
    createRoads();
    if (!restoreNature(data)) addNature(); // old saves without tree data: regenerate forest
    spawnSettlers();
    spawnAnimals();
    document.getElementById('upgrade-menu').style.display = 'none';
    document.getElementById('info-panel').style.display = 'none';
    updateBuildMenu();
    updateUI();
    log('Načítané ' + slotName);
    playSound(500, 0.15);
  } catch(e) { log('Chyba načítania'); }
}
document.getElementById('btn-save1').onclick = () => saveGame(1);
document.getElementById('btn-load1').onclick = () => loadGame(1);
document.getElementById('btn-save2').onclick = () => saveGame(2);
document.getElementById('btn-load2').onclick = () => loadGame(2);
document.getElementById('btn-loadauto').onclick = () => loadGame('Auto');
document.getElementById('btn-trade').onclick = () => {
  const tm = document.getElementById('trade-menu');
  tm.style.display = tm.style.display === 'none' ? 'flex' : 'none';
  if (tm.style.display === 'flex') updateTradeMenu();
};
function setMode(m) {
  if (m === 'center') {
    // 🎯 is a one-shot action: centre the camera but keep the current mode, so map taps keep working.
    controls.target.set(GRID*TILE/2, 0, GRID*TILE/2);
    camera.position.set(GRID*TILE/2, 20, GRID*TILE/2 + 12);
    return;
  }
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('selected', b.dataset.mode === m));
  mode = m;
  document.getElementById('upgrade-menu').style.display = 'none';
  document.getElementById('info-panel').style.display = 'none';
}
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => setMode(btn.dataset.mode);
});
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
// Act on a tap/click only (pointerup with little movement), so dragging/pinching the camera
// with OrbitControls does not place buildings, roads, sculpt or mine as a side effect.
const activePointers = new Map();
let tapCandidate = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  tapCandidate = (activePointers.size === 1 && e.button === 0) ? { id: e.pointerId, x: e.clientX, y: e.clientY } : null;
});
renderer.domElement.addEventListener('pointercancel', (e) => { activePointers.delete(e.pointerId); tapCandidate = null; });
window.addEventListener('pointerup', (e) => {
  const had = activePointers.delete(e.pointerId);
  const t = tapCandidate;
  if (!had || !t || t.id !== e.pointerId) return;
  tapCandidate = null;
  if (Math.hypot(e.clientX - t.x, e.clientY - t.y) > 8) return;
  handleCanvasTap(e);
});
function handleCanvasTap(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) / rect.width * 2 - 1;
  mouse.y = -(e.clientY - rect.top) / rect.height * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(terrainGroup.children, true);
  if (intersects.length) {
    const p = intersects[0].point;
    const x = Math.round(p.x / TILE);
    const y = Math.round(p.z / TILE);
    if (x >= 0 && x < GRID && y >= 0 && y < GRID) {
      if (mode === 'info') {
        const b = buildings.find(b => b.x === x && b.y === y);
        if (b) showBuildingInfo(b);
        else log('Režim info: klikni na budovu (na stavanie zvoľ budovu dole)');
        return;
      }
      if (mode === 'upgrade') {
        const th = buildings.find(b => b.type === 'townhall' && b.x === x && b.y === y);
        if (th) {
          showUpgradeMenu(th);
          log('Klikni na tlačidlo upgrade');
        } else {
          log('Režim vylepšenia: klikni na radnicu (na stavanie zvoľ budovu dole)');
        }
        return;
      }
      if (mode === 'road' && buildings.some(b => b.x===x && b.y===y)) { log('Tu stojí budova'); return; }
      if (mode === 'road' && !riverTiles.has(x+','+y) && !roadTiles.has(x+','+y)) {
        if (resources.stone >= 2) {
          resources.stone -= 2;
          roadTiles.add(x + ',' + y);
          createRoads();
          clearNatureAt(x, y);
          showFeedback(x*TILE, 'Cesta');
          log('Cesta postavená');
          playSound(300, 0.1);
          updateUI();
        } else log('Nedostatok kameňa');
      }
      else if ((mode === 'sculpt-up' || mode === 'sculpt-down') && riverTiles.has(x+','+y)) { log('Rieku sa nedá upravovať'); } // river is always drawn at water level; raising it made bridges/settlers float
      else if (mode === 'sculpt-up') { const h0 = terrainHeights[y][x]; terrainHeights[y][x] = Math.min(3, h0 + 0.4); createTerrain(); syncTileHeight(x, y, h0); showFeedback(x*TILE, '↑'); log('Zvýšené'); }
      else if (mode === 'sculpt-down') { const h0 = terrainHeights[y][x]; terrainHeights[y][x] = Math.max(0, h0 - 0.4); createTerrain(); syncTileHeight(x, y, h0); showFeedback(x*TILE, '↓'); log('Znížené'); }
      else if (mode === 'mine') {
        resources.stone += 3 + Math.random()*2;
        resources.coal += Math.random() > 0.6 ? 1 : 0;
        resources.iron += Math.random() > 0.75 ? 1 : 0;
        stats.produced += 3;
        showFeedback(x*TILE, '+3 🪨');
        spawnParticle(x, y, 0x78909c);
        playSound(150, 0.12, 'square');
        log('Vyťažené');
        updateUI();
      }
      else if (mode === 'build' && selectedBuilding && buildings.some(b => b.x===x && b.y===y)) { log('Tu už stojí budova – vyber voľné miesto'); }
      else if (mode === 'build' && selectedBuilding && roadTiles.has(x+','+y)) { log('Na ceste sa nedá stavať – vyber voľné miesto'); }
      else if (mode === 'build' && selectedBuilding) {
        if (selectedBuilding === 'bridge' && !riverTiles.has(x+','+y)) { log('Most len cez rieku'); return; }
        if (selectedBuilding !== 'bridge' && riverTiles.has(x+','+y)) { log('Nemôžeš stavať na vode'); return; }
        if (selectedBuilding === 'townhall' && buildings.some(b => b.type === 'townhall')) { log('Môžeš mať len jednu radnicu'); return; }
        const bt = buildingTypes[selectedBuilding];
        if (bt.era > era) { log(bt.name + ': vyžaduje éru ' + eras[bt.era]); return; }
        const cost = bt.cost;
        if (resources.wood >= (cost.wood||0) && resources.stone >= (cost.stone||0)) {
          resources.wood -= cost.wood||0; resources.stone -= cost.stone||0;
          buildings.push({ type: selectedBuilding, x, y, level: 1 });
          createBuilding(selectedBuilding, x, y, 1);
          clearNatureAt(x, y);
          if (selectedBuilding === 'house') resources.pop += 2;
          tryAutoRoad(x, y);
          spawnSettlers(true);
          showFeedback(x*TILE, bt.name);
          playSound(400, 0.15);
          log('Postavené: ' + bt.name);
          updateUI();
        } else log(bt.name + ' – ' + missingText(cost));
      }
    }
  }
}
function animate() {
  requestAnimationFrame(animate);
  animTime += 0.016;
  updateWeatherParticles();
  updateSettlers();
  updateAnimals();
  const sunAngle = (dayTime / 120) * Math.PI * 2;
  sun.position.set(Math.cos(sunAngle) * 20, Math.sin(sunAngle) * 15 + 5, Math.sin(sunAngle) * 10);
  buildingGroup.children.forEach(group => {
    group.children.forEach(child => {
      if (child.userData && child.userData.type === 'smoke') {
        child.position.y = (child.parent.children[0].geometry.parameters.height || 1) + 0.35 + Math.sin(animTime * 3 + child.userData.offset) * 0.1;
        child.scale.setScalar(0.8 + Math.sin(animTime * 4 + child.userData.offset) * 0.2);
      }
      if (child.userData && child.userData.type === 'crop') {
        child.rotation.y = animTime * 0.5;
        child.scale.y = 0.8 + Math.sin(animTime * 2) * 0.2;
      }
      if (child.userData && child.userData.type === 'flag') {
        child.rotation.y = Math.sin(animTime * 2) * 0.3;
      }
    });
  });
  controls.update();
  renderer.render(scene, camera);
}
setInterval(() => {
  stats.time++;
  buildings.forEach(b => {
    const bt = buildingTypes[b.type];
    const levelMult = b.level || 1;
    if (bt.consume) {
      let canProduce = true;
      for (const [k, v] of Object.entries(bt.consume)) {
        if ((resources[k] || 0) < v * 0.2) canProduce = false;
      }
      if (canProduce) {
        for (const [k, v] of Object.entries(bt.consume)) resources[k] -= v * 0.2;
        if (bt.prod) for (const [k, v] of Object.entries(bt.prod)) {
          if (k === 'pop') continue;
          resources[k] = (resources[k]||0) + v * 0.25 * levelMult;
          stats.produced += v * 0.25 * levelMult;
        }
      }
    } else if (bt.prod) {
      for (const [k, v] of Object.entries(bt.prod)) {
        // Houses grant population once when placed (+2), not every tick.
        if (k === 'pop') continue;
        resources[k] = (resources[k]||0) + v * 0.25 * levelMult;
        stats.produced += v * 0.25 * levelMult;
      }
    }
  });
  trees.forEach(t => {
    if (t.age < 1.2 && Math.random() > 0.88) {
      t.age += 0.008;
      applyTreeGrowth(t);
    }
  });
  const foodNeed = resources.pop * 0.04;
  const waterNeed = resources.pop * 0.02;
  if (resources.food >= foodNeed) resources.food -= foodNeed;
  else resources.happiness -= 0.5;
  if (resources.water >= waterNeed) resources.water -= waterNeed;
  else resources.happiness -= 0.4;
  if (resources.bread > 0 && resources.happiness < 90) {
    resources.bread -= 0.3;
    resources.happiness += 0.3;
  }
  const wt = weatherTypes[weather];
  resources.water += wt.water;
  resources.happiness += wt.happiness;
  if ((weather === 'rain' || weather === 'storm') && Math.random() > 0.6) playSound(800 + Math.random()*200, 0.05, 'sine');
  if (weather === 'storm' && Math.random() > 0.85) playSound(80, 0.3, 'sawtooth');
  weatherTimer++;
  if (weatherTimer >= weatherDuration) {
    const keys = Object.keys(weatherTypes);
    weather = keys[Math.floor(Math.random() * keys.length)];
    weatherTimer = 0;
    weatherDuration = 20 + Math.floor(Math.random() * 40);
    log('Počasie: ' + weatherTypes[weather].name);
  }
  resources.belief += resources.pop * 0.005;
  resources.science += buildings.filter(b => b.type === 'church').length * 0.1;
  if (resources.happiness < 30 && Math.random() > 0.7) {
    resources.pop = Math.max(4, resources.pop - 1);
    // Settlers who left must also disappear from the map (keep the rest where they are).
    if (settlers.length > Math.min(resources.pop, isMobile ? 5 : 10)) spawnSettlers(true);
  }
  if (resources.pop > stats.maxPop) stats.maxPop = resources.pop;
  if (era < eras.length - 1 && eraReqMet(era)) { era++; updateBuildMenu(); log('Nová éra: ' + eras[era] + '!'); playSound(600 + era * 100, 0.3 + era * 0.05); }
  resources.happiness = Math.max(10, Math.min(100, resources.happiness));
  dayTime = (dayTime + 1) % 120;
  const wt2 = weatherTypes[weather];
  if (dayTime < 20 || dayTime > 100) {
    scene.background = new THREE.Color(0x1a237e);
    ambient.intensity = wt2.ambient * 0.4;
  } else {
    scene.background = new THREE.Color(wt2.bg);
    ambient.intensity = wt2.ambient;
  }
  updateMinimap();
  updateUI();
}, 1000);
setInterval(() => { saveGame('Auto', true); log('Automaticky uložené'); }, 120000); // own slot, never overwrites manual slot 1
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
generateTerrain();
createTerrain();
addNature();
spawnSettlers();
spawnAnimals();
updateBuildMenu();
updateUI();
updateMinimap();
animate();
log('Opravené: minimapa je teraz malá v rohu!');
</script>
