<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>Epoch Settlers 3D</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a1a; color: #eee; overflow: hidden; height: 100dvh; touch-action: none; }
#ui { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; z-index: 10; padding-top: env(safe-area-inset-top); }
#top-bar { background: rgba(22,33,62,0.95); padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 4px; font-size: 11px; pointer-events: auto; }
.resource { background: #0f3460; padding: 3px 7px; border-radius: 10px; white-space: nowrap; }
.resource span { font-weight: bold; color: #ffd166; }
#bottom-ui { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(22,33,62,0.97); padding: 6px 8px 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); max-height: 34vh; overflow-y: auto; pointer-events: auto; }
.mode-btn, .build-btn, .ctrl { background: #0f3460; border: 1px solid #e94560; color: white; padding: 7px 9px; border-radius: 6px; font-size: 12px; margin: 2px; min-height: 36px; }
.mode-btn.selected, .build-btn.selected { background: #e94560; }
#canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#log { font-size: 12px; color: #a8dadc; margin: 4px 0; min-height: 16px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="ui">
  <div id="top-bar">
    <div class="resource">🍞 <span id="res-food">200</span></div>
    <div class="resource">🪵 <span id="res-wood">150</span></div>
    <div class="resource">🪨 <span id="res-stone">100</span></div>
    <div class="resource">⚫ <span id="res-coal">0</span></div>
    <div class="resource">⚙️ <span id="res-iron">0</span></div>
    <div class="resource">👥 <span id="res-pop">12</span></div>
    <div class="resource">🙏 <span id="res-belief">70</span></div>
  </div>
  <div id="bottom-ui">
    <div id="modes">
      <button class="mode-btn selected" data-mode="build">🏗️ Stavanie</button>
      <button class="mode-btn" data-mode="sculpt-up">⬆️ Zvýšiť</button>
      <button class="mode-btn" data-mode="sculpt-down">⬇️ Znížiť</button>
      <button class="mode-btn" data-mode="mine">⛏️ Ťažiť</button>
    </div>
    <div id="build-menu"></div>
    <div id="log"></div>
  </div>
</div>
<div id="canvas-container"></div>
<script>
const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
function makeBetterTexture(baseHex, variation = 60, size = 128, detail = true) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const r = parseInt(baseHex.slice(1,3),16), g = parseInt(baseHex.slice(3,5),16), b = parseInt(baseHex.slice(5,7),16);
  ctx.fillStyle = baseHex;
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < variation * 4; i++) {
    const vr = Math.max(0, Math.min(255, r + (Math.random()-0.5)*80));
    const vg = Math.max(0, Math.min(255, g + (Math.random()-0.5)*60));
    const vb = Math.max(0, Math.min(255, b + (Math.random()-0.5)*40));
    ctx.fillStyle = `rgba(${vr},${vg},${vb},${0.08 + Math.random()*0.25})`;
    const s = 1 + Math.random()*4;
    ctx.fillRect(Math.random()*size, Math.random()*size, s, s);
  }
  if (detail) {
    for (let i = 0; i < 30; i++) {
      ctx.strokeStyle = `rgba(0,0,0,${0.05 + Math.random()*0.1})`;
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(Math.random()*size, Math.random()*size);
      ctx.lineTo(Math.random()*size, Math.random()*size);
      ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  tex.anisotropy = 4;
  return tex;
}
const texGrass = makeBetterTexture('#3a7a2e', 70, 128, true);
const texWood = makeBetterTexture('#6d4c41', 40, 128, true);
const texStone = makeBetterTexture('#5d6d7e', 50, 128, true);
const texWater = makeBetterTexture('#1565c0', 30, 64, false);
const GRID = isMobile ? 18 : 22, TILE = 2;
let mode = 'build', selectedBuilding = 'hut';
let resources = { food: 200, wood: 150, stone: 100, coal: 0, iron: 0, pop: 12, belief: 70, science: 0 };
let terrainHeights = Array.from({length: GRID}, () => Array(GRID).fill(0));
let buildings = [];
let trees = [];
let rocks = [];
let settlers = [];
let riverTiles = new Set();
const buildingTypes = {
  hut: { name: "Chata", cost: { wood: 6, stone: 3 }, prod: { food: 1.2 }, height: 1.4, color: 0x8d6e63 },
  farm: { name: "Farma", cost: { wood: 8, stone: 4 }, prod: { food: 4.5 }, height: 1.1, color: 0x66bb6a },
  house: { name: "Dom", cost: { wood: 10, stone: 6 }, prod: { pop: 2 }, height: 2.0, color: 0xffcc80 },
  mine: { name: "Baňa", cost: { wood: 5, stone: 10 }, prod: { stone: 1.5, coal: 0.4 }, height: 1.6, color: 0x78909c }
};
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, isMobile ? 70 : 100);
const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(GRID*TILE/2, 15, GRID*TILE/2 + 11);
const renderer = new THREE.WebGLRenderer({ 
  antialias: !isMobile, 
  powerPreference: isMobile ? "low-power" : "high-performance" 
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.15 : 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
document.getElementById('canvas-container').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(GRID*TILE/2, 0, GRID*TILE/2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 5;
controls.maxDistance = 40;
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a5f0b, 0.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff5e1, 1.0);
sun.position.set(20, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 512 : 1024, isMobile ? 512 : 1024);
scene.add(sun);
const terrainGroup = new THREE.Group();
scene.add(terrainGroup);
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);
const natureGroup = new THREE.Group();
scene.add(natureGroup);
const waterGroup = new THREE.Group();
scene.add(waterGroup);
const settlerGroup = new THREE.Group();
scene.add(settlerGroup);
function initRivers() {
  for (let y = 3; y < GRID - 3; y++) {
    const x = Math.floor(GRID / 2) + Math.floor(Math.sin(y * 0.3) * 1.5);
    if (x >= 0 && x < GRID) riverTiles.add(x + ',' + y);
  }
}
function createTerrain() {
  terrainGroup.clear();
  waterGroup.clear();
  const geo = new THREE.BoxGeometry(TILE, 0.4, TILE);
  const matGrass = new THREE.MeshStandardMaterial({ map: texGrass, roughness: 0.75, metalness: 0.02 });
  const matWater = new THREE.MeshStandardMaterial({ map: texWater, roughness: 0.2, metalness: 0.15, transparent: true, opacity: 0.8 });
  const instGrass = new THREE.InstancedMesh(geo, matGrass, GRID*GRID);
  const instWater = new THREE.InstancedMesh(geo, matWater, Math.max(1, riverTiles.size));
  instGrass.receiveShadow = true;
  const dummy = new THREE.Object3D();
  let gi = 0, wi = 0;
  for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
    const isRiver = riverTiles.has(x + ',' + y);
    const h = terrainHeights[y][x];
    const height = isRiver ? 0.12 : 0.4 + Math.abs(h) * 0.28;
    dummy.position.set(x*TILE, height/2, y*TILE);
    dummy.scale.y = height;
    dummy.updateMatrix();
    if (isRiver && wi < riverTiles.size) instWater.setMatrixAt(wi++, dummy.matrix);
    else instGrass.setMatrixAt(gi++, dummy.matrix);
  }
  instGrass.instanceMatrix.needsUpdate = true;
  instWater.instanceMatrix.needsUpdate = true;
  terrainGroup.add(instGrass);
  waterGroup.add(instWater);
}
function addNature() {
  natureGroup.clear();
  trees = [];
  rocks = [];
  const treeCount = isMobile ? 25 : 40;
  for (let i = 0; i < treeCount; i++) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    if (riverTiles.has(x + ',' + y) || buildings.some(b => Math.abs(b.x - x) < 1 && Math.abs(b.y - y) < 1)) continue;
    const h = Math.max(0, terrainHeights[y][x] * 0.22);
    const age = 0.7 + Math.random() * 0.5;
    trees.push({ x, y, age, mesh: null });
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.13*age, 0.2*age, 1.5*age, 6), new THREE.MeshStandardMaterial({ map: texWood, roughness: 0.8 }));
    const leaves1 = new THREE.Mesh(new THREE.SphereGeometry(0.8*age, 7, 5), new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.5 }));
    const leaves2 = new THREE.Mesh(new THREE.SphereGeometry(0.55*age, 6, 4), new THREE.MeshStandardMaterial({ color: 0x388e3c, roughness: 0.5 }));
    trunk.position.set(x*TILE, h + 0.75*age, y*TILE);
    leaves1.position.set(x*TILE, h + 1.7*age, y*TILE);
    leaves2.position.set(x*TILE + 0.2, h + 1.9*age, y*TILE);
    trunk.castShadow = leaves1.castShadow = !isMobile;
    natureGroup.add(trunk, leaves1, leaves2);
    trees[trees.length-1].mesh = { trunk, leaves1, leaves2 };
  }
  for (let i = 0; i < (isMobile ? 8 : 14); i++) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    if (riverTiles.has(x + ',' + y)) continue;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4 + Math.random()*0.3, 0), new THREE.MeshStandardMaterial({ map: texStone, roughness: 0.85 }));
    rock.position.set(x*TILE, 0.3, y*TILE);
    rock.rotation.set(Math.random()*2, Math.random()*2, Math.random()*2);
    natureGroup.add(rock);
    rocks.push({ x, y, mesh: rock });
  }
}
function spawnSettlers() {
  settlerGroup.clear();
  settlers = [];
  const count = Math.min(resources.pop, isMobile ? 7 : 12);
  for (let i = 0; i < count; i++) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    const settler = { x, y, targetX: x, targetY: y, job: 'idle', mesh: null, speed: 0.018 + Math.random() * 0.012 };
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.65, 6), new THREE.MeshStandardMaterial({ color: 0xffcc80, roughness: 0.55 }));
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 6, 5), new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.45 }));
    body.position.set(x*TILE, 0.45, y*TILE);
    head.position.set(x*TILE, 0.85, y*TILE);
    settlerGroup.add(body, head);
    settler.mesh = { body, head };
    settlers.push(settler);
  }
}
function updateSettlers() {
  settlers.forEach(s => {
    if (Math.random() > 0.93) {
      s.targetX = Math.max(0, Math.min(GRID-1, s.x + (Math.random()-0.5)*5));
      s.targetY = Math.max(0, Math.min(GRID-1, s.y + (Math.random()-0.5)*5));
      s.job = Math.random() > 0.4 ? 'gather' : 'idle';
    }
    const dx = s.targetX - s.x;
    const dy = s.targetY - s.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 0.15) {
      s.x += (dx / dist) * s.speed * 7;
      s.y += (dy / dist) * s.speed * 7;
    }
    if (s.mesh) {
      s.mesh.body.position.set(s.x*TILE, 0.45, s.y*TILE);
      s.mesh.head.position.set(s.x*TILE, 0.85, s.y*TILE);
    }
    if (s.job === 'gather' && Math.random() > 0.96) {
      resources.wood += 0.35;
      resources.food += 0.25;
      if (Math.random() > 0.65) resources.stone += 0.5;
    }
  });
}
function createBuilding(type, x, y) {
  const bt = buildingTypes[type];
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ map: type === 'mine' ? texStone : texWood, color: bt.color, roughness: 0.6 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.7, bt.height, TILE*0.7), bodyMat);
  body.position.y = bt.height / 2;
  body.castShadow = body.receiveShadow = !isMobile;
  group.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(TILE*0.5, bt.height * 0.45, 4), new THREE.MeshStandardMaterial({ color: 0x4e342e, roughness: 0.65 }));
  roof.position.y = bt.height + 0.18;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = !isMobile;
  group.add(roof);
  group.position.set(x*TILE, Math.max(0, terrainHeights[y][x]*0.22), y*TILE);
  buildingGroup.add(group);
}
function updateUI() {
  ['food','wood','stone','coal','iron','pop','belief','science'].forEach(k => {
    const el = document.getElementById('res-' + k);
    if (el) el.textContent = Math.floor(resources[k] || 0);
  });
}
function log(msg) { document.getElementById('log').textContent = msg; }
function updateBuildMenu() {
  const menu = document.getElementById('build-menu');
  menu.innerHTML = '';
  Object.entries(buildingTypes).forEach(([k, v]) => {
    const btn = document.createElement('button');
    btn.className = 'build-btn' + (selectedBuilding === k ? ' selected' : '');
    btn.textContent = v.name;
    btn.onclick = () => { selectedBuilding = k; updateBuildMenu(); };
    menu.appendChild(btn);
  });
}
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    mode = btn.dataset.mode;
  };
});
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) / rect.width * 2 - 1;
  mouse.y = -(e.clientY - rect.top) / rect.height * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(terrainGroup.children, true);
  if (intersects.length) {
    const p = intersects[0].point;
    const x = Math.round(p.x / TILE);
    const y = Math.round(p.z / TILE);
    if (x >= 0 && x < GRID && y >= 0 && y < GRID) {
      if (mode === 'sculpt-up') { terrainHeights[y][x] = Math.min(4, terrainHeights[y][x] + 1); createTerrain(); addNature(); log('Terén zvýšený'); }
      else if (mode === 'sculpt-down') { terrainHeights[y][x] = Math.max(-2, terrainHeights[y][x] - 1); createTerrain(); addNature(); log('Terén znížený'); }
      else if (mode === 'mine') {
        resources.stone += 5 + Math.random()*3;
        resources.coal += Math.random() > 0.5 ? 1 : 0;
        resources.iron += Math.random() > 0.65 ? 1 : 0;
        log('Vyťažené suroviny');
        updateUI();
      }
      else if (mode === 'build' && selectedBuilding && !buildings.some(b => b.x===x && b.y===y) && !riverTiles.has(x+','+y)) {
        const cost = buildingTypes[selectedBuilding].cost;
        if (resources.wood >= (cost.wood||0) && resources.stone >= (cost.stone||0)) {
          resources.wood -= cost.wood||0; resources.stone -= cost.stone||0;
          buildings.push({ type: selectedBuilding, x, y });
          createBuilding(selectedBuilding, x, y);
          if (selectedBuilding === 'house') resources.pop += 2;
          spawnSettlers();
          log('Postavené: ' + buildingTypes[selectedBuilding].name);
          updateUI();
        } else log('Nedostatok zdrojov');
      }
    }
  }
});
function animate() {
  requestAnimationFrame(animate);
  updateSettlers();
  controls.update();
  renderer.render(scene, camera);
}
setInterval(() => {
  buildings.forEach(b => {
    const prod = buildingTypes[b.type].prod;
    if (prod) Object.entries(prod).forEach(([k,v]) => resources[k] = (resources[k]||0) + v * 0.32);
  });
  trees.forEach(t => {
    if (t.age < 1.3 && Math.random() > 0.9) {
      t.age += 0.03;
      if (t.mesh) {
        t.mesh.trunk.scale.set(1, t.age, 1);
        t.mesh.leaves1.scale.set(t.age, t.age, t.age);
        t.mesh.leaves2.scale.set(t.age, t.age, t.age);
      }
    }
  });
  resources.belief += resources.pop * 0.012;
  resources.science += resources.pop * 0.005;
  if (resources.food > resources.pop * 0.12) resources.food -= resources.pop * 0.035;
  updateUI();
}, 1000);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
initRivers();
createTerrain();
addNature();
spawnSettlers();
updateBuildMenu();
updateUI();
animate();
log('Krajšia grafika! Lepšie textúry, stromy a osvetlenie.');
</script>
</body>
</html>
