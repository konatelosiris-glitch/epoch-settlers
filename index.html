<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>Epoch Settlers 3D</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a1a; color: #eee; overflow: hidden; height: 100dvh; touch-action: none; }
#ui { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10; }
#top-bar { 
  position: absolute; top: 0; left: 0; right: 0;
  background: rgba(22,33,62,0.95); 
  padding: 4px 4px; 
  padding-top: max(4px, env(safe-area-inset-top));
  display: flex; flex-wrap: wrap; gap: 3px; 
  font-size: 11px; 
  pointer-events: none;
}
.resource { background: #0f3460; padding: 2px 6px; border-radius: 10px; white-space: nowrap; font-size: 11px; }
.resource span { font-weight: bold; color: #ffd166; }
#bottom-ui { 
  position: absolute; bottom: 0; left: 0; right: 0; 
  background: rgba(22,33,62,0.97); 
  padding: 4px 4px 6px; 
  padding-bottom: max(6px, env(safe-area-inset-bottom));
  max-height: 32vh; 
  overflow-y: auto; 
  pointer-events: auto;
  border-top: 1px solid #e94560;
}
#modes { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
.mode-btn, .build-btn, .save-btn, .trade-btn, .upgrade-btn { 
  background: #0f3460; border: 1px solid #e94560; color: white; 
  padding: 6px 8px; border-radius: 6px; font-size: 11px; 
  margin: 1px; min-height: 32px; min-width: 48px;
  flex: 1 1 auto;
}
.mode-btn.selected, .build-btn.selected { background: #e94560; }
.save-btn { background: #1b5e20; border-color: #4caf50; font-size: 10px; padding: 5px 6px; }
.trade-btn { background: #4a148c; border-color: #9c27b0; font-size: 10px; }
.upgrade-btn { background: #f57c00; border-color: #ff9800; font-weight: bold; }
#build-menu, #trade-menu, #upgrade-menu { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
#log { font-size: 11px; color: #a8dadc; margin: 2px 0; min-height: 14px; text-align: center; }
#era { font-size: 12px; color: #ffd166; text-align: center; margin: 2px 0; font-weight: bold; }
#stats { font-size: 10px; color: #90a4ae; text-align: center; margin: 1px 0; }
#canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
canvas { display: block; width: 100% !important; height: 100% !important; }
#feedback { position: absolute; pointer-events: none; font-size: 16px; font-weight: bold; color: #ffeb3b; text-shadow: 1px 1px 2px #000; z-index: 20; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="ui">
  <div id="top-bar">
    <div class="resource">🍞 <span id="res-food">200</span></div>
    <div class="resource">🥖 <span id="res-bread">0</span></div>
    <div class="resource">🪵 <span id="res-wood">150</span></div>
    <div class="resource">🪵 <span id="res-planks">0</span></div>
    <div class="resource">🪨 <span id="res-stone">100</span></div>
    <div class="resource">🔨 <span id="res-tools">0</span></div>
    <div class="resource">💧 <span id="res-water">50</span></div>
    <div class="resource">⚫ <span id="res-coal">0</span></div>
    <div class="resource">⚙️ <span id="res-iron">0</span></div>
    <div class="resource">👥 <span id="res-pop">12</span></div>
    <div class="resource">😊 <span id="res-happiness">70</span></div>
    <div class="resource">🙏 <span id="res-belief">70</span></div>
    <div class="resource">🔬 <span id="res-science">0</span></div>
    <div class="resource">💰 <span id="res-gold">0</span></div>
  </div>
  <div id="bottom-ui">
    <div id="era">Éra: Pravek</div>
    <div id="stats">Vyrobené: 0 | Max pop: 12 | Čas: 0m</div>
    <div id="modes">
      <button class="mode-btn selected" data-mode="build">🏗️</button>
      <button class="mode-btn" data-mode="road">🛣️</button>
      <button class="mode-btn" data-mode="sculpt-up">⬆️</button>
      <button class="mode-btn" data-mode="sculpt-down">⬇️</button>
      <button class="mode-btn" data-mode="mine">⛏️</button>
      <button class="mode-btn" data-mode="upgrade">⬆️</button>
      <button class="mode-btn" data-mode="center">🎯</button>
      <button class="trade-btn" id="btn-trade">💰</button>
      <button class="save-btn" id="btn-save1">💾1</button>
      <button class="save-btn" id="btn-load1">📂1</button>
      <button class="save-btn" id="btn-save2">💾2</button>
      <button class="save-btn" id="btn-load2">📂2</button>
    </div>
    <div id="build-menu"></div>
    <div id="upgrade-menu" style="display:none;"></div>
    <div id="trade-menu" style="display:none;"></div>
    <div id="log"></div>
  </div>
</div>
<div id="canvas-container"></div>
<div id="feedback"></div>
<script>
const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
const GRID = isMobile ? 40 : 60, TILE = 2;
let mode = 'build', selectedBuilding = 'townhall';
let era = 0;
const eras = ['Pravek', 'Doba kamenná', 'Doba bronzová'];
let resources = { food: 200, bread: 0, wood: 150, planks: 0, stone: 100, tools: 0, water: 50, coal: 0, iron: 0, pop: 12, happiness: 70, belief: 70, science: 0, gold: 0 };
let stats = { produced: 0, maxPop: 12, time: 0 };
let terrainHeights = Array.from({length: GRID}, () => Array(GRID).fill(0));
let buildings = [];
let trees = [];
let rocks = [];
let settlers = [];
let riverTiles = new Set();
let roadTiles = new Set();
let seed = Math.random() * 10000;
let weather = 'clear';
let dayTime = 0;
let animTime = 0;
function makeTexture(color, type) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, 128, 128);
  if (type === 'wood') {
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 2;
    for (let i = 0; i < 16; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * 8);
      ctx.lineTo(128, i * 8 + 3);
      ctx.stroke();
    }
  } else if (type === 'stone') {
    ctx.fillStyle = '#5d4037';
    for (let i = 0; i < 8; i++) {
      for (let j = 0; j < 8; j++) {
        if (Math.random() > 0.35) ctx.fillRect(i*16+1, j*16+1, 14, 14);
      }
    }
  } else if (type === 'roof') {
    ctx.strokeStyle = '#2e1a1a';
    ctx.lineWidth = 3;
    for (let i = 0; i < 16; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * 8);
      ctx.lineTo(128, i * 8);
      ctx.stroke();
    }
  } else if (type === 'grass') {
    ctx.fillStyle = '#388e3c';
    for (let i = 0; i < 80; i++) {
      ctx.fillRect(Math.random()*128, Math.random()*128, 3, 4);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const textures = {
  wood: makeTexture('#8d6e63', 'wood'),
  stone: makeTexture('#78909c', 'stone'),
  roof: makeTexture('#3e2723', 'roof'),
  grass: makeTexture('#4caf50', 'grass'),
  farm: makeTexture('#66bb6a', 'grass'),
  mine: makeTexture('#546e7a', 'stone'),
  townhall: makeTexture('#6d4c41', 'stone')
};
const buildingTypes = {
  townhall: { name: "Radnica", cost: { wood: 20, stone: 15 }, prod: { belief: 2, science: 0.5, gold: 0.3 }, height: 2.8, tex: textures.townhall, era: 0 },
  hut: { name: "Chata", cost: { wood: 6, stone: 3 }, prod: { food: 0.5 }, height: 1.2, tex: textures.wood, era: 0 },
  farm: { name: "Farma", cost: { wood: 8, stone: 4 }, prod: { food: 2.5 }, height: 1.0, tex: textures.farm, era: 0 },
  house: { name: "Dom", cost: { wood: 10, stone: 6 }, prod: { pop: 2 }, height: 1.8, tex: textures.wood, era: 0 },
  mine: { name: "Baňa", cost: { wood: 5, stone: 10 }, prod: { stone: 1.2, coal: 0.3 }, height: 1.4, tex: textures.mine, era: 0 },
  well: { name: "Studňa", cost: { wood: 4, stone: 8 }, prod: { water: 2 }, height: 1.0, tex: textures.stone, era: 0 },
  lumberjack: { name: "Drevorubač", cost: { wood: 10, stone: 5 }, prod: { wood: 1.8 }, height: 1.5, tex: textures.wood, era: 0 },
  forester: { name: "Lesník", cost: { wood: 8, stone: 4 }, prod: {}, height: 1.4, tex: textures.wood, era: 0 },
  bakery: { name: "Pekáreň", cost: { wood: 12, stone: 6 }, prod: { bread: 1.5 }, consume: { food: 1 }, height: 1.6, tex: textures.wood, era: 1 },
  lumber: { name: "Drevár", cost: { wood: 10, stone: 4 }, prod: { planks: 1 }, consume: { wood: 1.5 }, height: 1.5, tex: textures.wood, era: 1 },
  smith: { name: "Kováč", cost: { wood: 8, stone: 12 }, prod: { tools: 0.8 }, consume: { iron: 0.5, coal: 0.3 }, height: 1.7, tex: textures.stone, era: 2 },
  church: { name: "Kostol", cost: { wood: 15, stone: 12 }, prod: { belief: 1.5, science: 0.3 }, height: 2.5, tex: textures.stone, era: 1 },
  storage: { name: "Sklad", cost: { wood: 8, stone: 8 }, prod: {}, height: 1.3, tex: textures.wood, era: 0 },
  bridge: { name: "Most", cost: { wood: 8, stone: 6 }, prod: {}, height: 0.4, tex: textures.wood, era: 0 }
};
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x64b5f6);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 400);
camera.position.set(GRID*TILE/2, 28, GRID*TILE/2 + 20);
camera.lookAt(GRID*TILE/2, 0, GRID*TILE/2);
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.setClearColor(0x64b5f6);
document.getElementById('canvas-container').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(GRID*TILE/2, 0, GRID*TILE/2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.2;
controls.minDistance = 5;
controls.maxDistance = 120;
const ambient = new THREE.AmbientLight(0xffffff, 0.75);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(10, 20, 8);
scene.add(sun);
const terrainGroup = new THREE.Group();
scene.add(terrainGroup);
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);
const natureGroup = new THREE.Group();
scene.add(natureGroup);
const roadGroup = new THREE.Group();
scene.add(roadGroup);
const settlerGroup = new THREE.Group();
scene.add(settlerGroup);
function noise(x, y) {
  const n = Math.sin(x * 0.15 + seed) * Math.cos(y * 0.12 + seed * 0.7);
  const n2 = Math.sin(x * 0.35 + seed * 1.3) * Math.cos(y * 0.28 + seed);
  const n3 = Math.sin(x * 0.7 + seed * 0.5) * Math.cos(y * 0.6 + seed * 1.1);
  return (n + n2 * 0.5 + n3 * 0.25 + 1.5) * 0.5;
}
function generateTerrain() {
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      let h = noise(x * 0.04, y * 0.04) * 9;
      h += noise(x * 0.12, y * 0.12) * 3.5;
      h += noise(x * 0.35, y * 0.35) * 1.5;
      terrainHeights[y][x] = Math.max(0, h - 2.8);
    }
  }
  for (let y = 3; y < GRID - 3; y++) {
    const x = Math.floor(GRID / 2) + Math.floor(Math.sin(y * 0.08 + seed) * 6);
    if (x >= 0 && x < GRID) {
      riverTiles.add(x + ',' + y);
      terrainHeights[y][x] = 0;
      if (x+1 < GRID) { riverTiles.add((x+1) + ',' + y); terrainHeights[y][x+1] = 0; }
    }
  }
}
function createTerrain() {
  while (terrainGroup.children.length) terrainGroup.remove(terrainGroup.children[0]);
  const geo = new THREE.BoxGeometry(TILE, 0.4, TILE);
  const matGrass = new THREE.MeshLambertMaterial({ map: textures.grass });
  const matWater = new THREE.MeshLambertMaterial({ color: 0x2196f3 });
  const matMountain = new THREE.MeshLambertMaterial({ color: 0x8d6e63 });
  const matValley = new THREE.MeshLambertMaterial({ color: 0x81c784 });
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const isRiver = riverTiles.has(x + ',' + y);
      const h = terrainHeights[y][x];
      const height = isRiver ? 0.1 : 0.4 + h * 0.5;
      let mat = matGrass;
      if (isRiver) mat = matWater;
      else if (h > 4) mat = matMountain;
      else if (h < 0.7) mat = matValley;
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x*TILE, height/2, y*TILE);
      mesh.scale.y = height;
      terrainGroup.add(mesh);
    }
  }
}
function createRoads() {
  while (roadGroup.children.length) roadGroup.remove(roadGroup.children[0]);
  const geo = new THREE.BoxGeometry(TILE * 0.7, 0.08, TILE * 0.7);
  const matRoad = new THREE.MeshLambertMaterial({ color: 0x6d4c41 });
  roadTiles.forEach(key => {
    const [x, y] = key.split(',').map(Number);
    const mesh = new THREE.Mesh(geo, matRoad);
    mesh.position.set(x*TILE, 0.12, y*TILE);
    roadGroup.add(mesh);
  });
}
function addNature() {
  while (natureGroup.children.length) natureGroup.remove(natureGroup.children[0]);
  trees = [];
  rocks = [];
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      if (riverTiles.has(x + ',' + y) || roadTiles.has(x + ',' + y) || buildings.some(b => b.x === x && b.y === y)) continue;
      const h = terrainHeights[y][x];
      if (h < 4 && Math.random() > 0.78) {
        const age = 0.7 + Math.random() * 0.7;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14*age, 0.2*age, 1.5*age, 5), new THREE.MeshLambertMaterial({ color: 0x5d4037 }));
        const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.75*age, 6, 5), new THREE.MeshLambertMaterial({ color: 0x2e7d32 }));
        trunk.position.set(x*TILE, 0.8*age, y*TILE);
        leaves.position.set(x*TILE, 1.7*age, y*TILE);
        natureGroup.add(trunk, leaves);
        trees.push({ x, y, age, mesh: { trunk, leaves } });
      } else if (h > 2.5 && Math.random() > 0.86) {
        const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3 + Math.random()*0.2, 0), new THREE.MeshLambertMaterial({ color: 0x78909c }));
        rock.position.set(x*TILE, 0.25, y*TILE);
        natureGroup.add(rock);
        rocks.push({ x, y, mesh: rock });
      }
    }
  }
}
function spawnSettlers() {
  while (settlerGroup.children.length) settlerGroup.remove(settlerGroup.children[0]);
  settlers = [];
  const count = Math.min(resources.pop, isMobile ? 8 : 15);
  for (let i = 0; i < count; i++) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.5, 4), new THREE.MeshLambertMaterial({ color: 0xffcc80 }));
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 4, 3), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
    body.position.set(x*TILE, 0.35, y*TILE);
    head.position.set(x*TILE, 0.7, y*TILE);
    settlerGroup.add(body, head);
    settlers.push({ x, y, targetX: x, targetY: y, job: 'idle', mesh: { body, head }, onRoad: false, animOffset: Math.random() * Math.PI * 2 });
  }
}
function findWork(s) {
  const foresters = buildings.filter(b => b.type === 'forester');
  if (foresters.length && Math.random() > 0.5) {
    const f = foresters[Math.floor(Math.random() * foresters.length)];
    for (let i = 0; i < 5; i++) {
      const px = Math.max(0, Math.min(GRID-1, f.x + Math.floor((Math.random()-0.5)*6)));
      const py = Math.max(0, Math.min(GRID-1, f.y + Math.floor((Math.random()-0.5)*6)));
      if (!riverTiles.has(px+','+py) && !roadTiles.has(px+','+py) && !buildings.some(b => b.x===px && b.y===py) && !trees.some(t => t.x===px && t.y===py)) {
        s.targetX = px;
        s.targetY = py;
        s.job = 'plant';
        return;
      }
    }
  }
  const lumberjacks = buildings.filter(b => b.type === 'lumberjack');
  if (lumberjacks.length && trees.length && Math.random() > 0.4) {
    const lj = lumberjacks[Math.floor(Math.random() * lumberjacks.length)];
    const nearby = trees.filter(t => Math.abs(t.x - lj.x) + Math.abs(t.y - lj.y) < 8);
    if (nearby.length) {
      const t = nearby[Math.floor(Math.random() * nearby.length)];
      s.targetX = t.x;
      s.targetY = t.y;
      s.job = 'chop';
      s.chopTarget = t;
      return;
    }
  }
  const works = buildings.filter(b => ['farm','mine','bakery','lumber','smith'].includes(b.type));
  if (works.length && Math.random() > 0.35) {
    const w = works[Math.floor(Math.random() * works.length)];
    s.targetX = w.x;
    s.targetY = w.y;
    s.job = 'work';
    return;
  }
  s.targetX = Math.max(0, Math.min(GRID-1, s.x + (Math.random()-0.5)*5));
  s.targetY = Math.max(0, Math.min(GRID-1, s.y + (Math.random()-0.5)*5));
  s.job = 'idle';
}
function plantTree(x, y) {
  const age = 0.3;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.6, 4), new THREE.MeshLambertMaterial({ color: 0x5d4037 }));
  const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.35, 5, 4), new THREE.MeshLambertMaterial({ color: 0x4caf50 }));
  trunk.position.set(x*TILE, 0.4, y*TILE);
  leaves.position.set(x*TILE, 0.9, y*TILE);
  natureGroup.add(trunk, leaves);
  trees.push({ x, y, age, mesh: { trunk, leaves } });
}
function updateSettlers() {
  settlers.forEach(s => {
    if (Math.random() > 0.91) findWork(s);
    const dx = s.targetX - s.x;
    const dy = s.targetY - s.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const speed = (s.onRoad ? 0.06 : 0.03) * (s.job === 'chop' || s.job === 'work' || s.job === 'plant' ? 1.3 : 1);
    if (dist > 0.3) {
      s.x += (dx / dist) * speed * 5;
      s.y += (dy / dist) * speed * 5;
    }
    s.onRoad = roadTiles.has(Math.round(s.x) + ',' + Math.round(s.y));
    if (s.mesh) {
      const bob = Math.sin(animTime * 8 + s.animOffset) * 0.04;
      s.mesh.body.position.set(s.x*TILE, 0.35 + bob, s.y*TILE);
      s.mesh.head.position.set(s.x*TILE, 0.7 + bob, s.y*TILE);
      if (s.job === 'chop' || s.job === 'work' || s.job === 'plant') {
        s.mesh.body.rotation.z = Math.sin(animTime * 12 + s.animOffset) * 0.15;
      } else {
        s.mesh.body.rotation.z = 0;
      }
    }
    if (s.job === 'chop' && s.chopTarget && dist < 0.5 && Math.random() > 0.92) {
      resources.wood += 3 + Math.random()*2;
      stats.produced += 3;
      showFeedback(s.x*TILE, '+3 🪵');
      if (s.chopTarget.mesh) {
        natureGroup.remove(s.chopTarget.mesh.trunk);
        natureGroup.remove(s.chopTarget.mesh.leaves);
      }
      trees = trees.filter(t => t !== s.chopTarget);
      s.chopTarget = null;
      s.job = 'idle';
    }
    if (s.job === 'plant' && dist < 0.5 && Math.random() > 0.93) {
      const px = Math.round(s.x);
      const py = Math.round(s.y);
      if (!trees.some(t => t.x===px && t.y===py)) {
        plantTree(px, py);
        showFeedback(s.x*TILE, '🌱');
      }
      s.job = 'idle';
    }
    if (s.job === 'work' && dist < 0.5 && Math.random() > 0.94) {
      resources.food += 0.2;
      resources.wood += 0.1;
    }
  });
}
function showFeedback(worldX, text) {
  const fb = document.getElementById('feedback');
  fb.textContent = text;
  fb.style.left = '50%';
  fb.style.top = '40%';
  fb.style.transform = 'translate(-50%, -50%)';
  fb.style.opacity = '1';
  setTimeout(() => fb.style.opacity = '0', 800);
}
function createBuilding(type, x, y, level = 1) {
  const bt = buildingTypes[type];
  const group = new THREE.Group();
  const height = bt.height * (1 + (level-1) * 0.25);
  const bodyMat = new THREE.MeshLambertMaterial({ map: bt.tex });
  if (type === 'townhall') {
    const base = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.85, height*0.6, TILE*0.85), bodyMat);
    base.position.y = height*0.3;
    group.add(base);
    const mid = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.65, height*0.5, TILE*0.65), bodyMat);
    mid.position.y = height*0.75;
    group.add(mid);
    const top = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.45, height*0.3, TILE*0.45), bodyMat);
    top.position.y = height*1.1;
    group.add(top);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(TILE*0.35, height*0.4, 4), new THREE.MeshLambertMaterial({ map: textures.roof }));
    roof.position.y = height*1.4;
    roof.rotation.y = Math.PI / 4;
    group.add(roof);
    const flag = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.35, 0.18), new THREE.MeshLambertMaterial({ color: 0xe94560 }));
    flag.position.set(0, height*1.65, 0);
    flag.userData = { type: 'flag' };
    group.add(flag);
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.4, 0.05), new THREE.MeshLambertMaterial({ color: 0x3e2723 }));
    door.position.set(0, 0.25, TILE*0.43);
    group.add(door);
    for (let i = 0; i < 3; i++) {
      const win = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.05), new THREE.MeshLambertMaterial({ color: 0x90caf9 }));
      win.position.set(-0.2 + i*0.2, height*0.55, TILE*0.43);
      group.add(win);
    }
  } else {
    const body = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.65, height, TILE*0.65), bodyMat);
    body.position.y = height / 2;
    group.add(body);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(TILE*0.45, height * 0.45, 4), new THREE.MeshLambertMaterial({ map: textures.roof }));
    roof.position.y = height + 0.15;
    roof.rotation.y = Math.PI / 4;
    group.add(roof);
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.35, 0.05), new THREE.MeshLambertMaterial({ color: 0x3e2723 }));
    door.position.set(0, 0.2, TILE*0.33);
    group.add(door);
  }
  if (['mine','bakery','smith','lumber'].includes(type)) {
    const smoke = new THREE.Mesh(new THREE.SphereGeometry(0.15, 4, 3), new THREE.MeshLambertMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.6 }));
    smoke.position.y = height + 0.5;
    smoke.userData = { type: 'smoke', offset: Math.random() * Math.PI * 2 };
    group.add(smoke);
  }
  if (type === 'farm') {
    const crop = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 4), new THREE.MeshLambertMaterial({ color: 0x8bc34a }));
    crop.position.set(0.3, 0.3, 0.3);
    crop.userData = { type: 'crop' };
    group.add(crop);
  }
  group.position.set(x*TILE, Math.max(0, terrainHeights[y][x]*0.3), y*TILE);
  group.userData = { type, x, y, level };
  buildingGroup.add(group);
}
function tryAutoRoad(x, y) {
  const neighbors = [[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
  for (const [nx, ny] of neighbors) {
    if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID && !riverTiles.has(nx+','+ny) && !roadTiles.has(nx+','+ny) && resources.stone >= 2) {
      resources.stone -= 2;
      roadTiles.add(nx + ',' + ny);
      createRoads();
      return;
    }
  }
}
function updateUI() {
  ['food','bread','wood','planks','stone','tools','water','coal','iron','pop','happiness','belief','science','gold'].forEach(k => {
    const el = document.getElementById('res-' + k);
    if (el) el.textContent = Math.floor(resources[k] || 0);
  });
  document.getElementById('era').textContent = 'Éra: ' + eras[era] + ' | ' + (weather === 'rain' ? 'Dážď' : 'Jasno');
  document.getElementById('stats').textContent = 'Vyrobené: ' + Math.floor(stats.produced) + ' | Max: ' + stats.maxPop + ' | ' + Math.floor(stats.time/60) + 'm';
}
function log(msg) { document.getElementById('log').textContent = msg; }
function updateBuildMenu() {
  const menu = document.getElementById('build-menu');
  menu.innerHTML = '';
  Object.entries(buildingTypes).forEach(([k, v]) => {
    if (v.era > era) return;
    const btn = document.createElement('button');
    btn.className = 'build-btn' + (selectedBuilding === k ? ' selected' : '');
    btn.textContent = v.name;
    btn.onclick = () => { selectedBuilding = k; updateBuildMenu(); };
    menu.appendChild(btn);
  });
}
function showUpgradeMenu(building) {
  const menu = document.getElementById('upgrade-menu');
  menu.innerHTML = '';
  menu.style.display = 'flex';
  const level = building.level || 1;
  const costWood = 15 * level;
  const costStone = 12 * level;
  const btn = document.createElement('button');
  btn.className = 'upgrade-btn';
  btn.textContent = 'Upgrade Radnice na úroveň ' + (level+1) + ' (' + costWood + '🪵 ' + costStone + '🪨)';
  btn.onclick = () => {
    if (resources.wood >= costWood && resources.stone >= costStone) {
      resources.wood -= costWood;
      resources.stone -= costStone;
      building.level = level + 1;
      while (buildingGroup.children.length) buildingGroup.remove(buildingGroup.children[0]);
      buildings.forEach(b => createBuilding(b.type, b.x, b.y, b.level || 1));
      log('Radnica vylepšená na úroveň ' + building.level + '!');
      updateUI();
      menu.style.display = 'none';
    } else {
      log('Nedostatok zdrojov na upgrade');
    }
  };
  menu.appendChild(btn);
}
function updateTradeMenu() {
  const menu = document.getElementById('trade-menu');
  menu.innerHTML = '';
  const trades = [
    { name: 'Predaj jedlo +5', res: 'food', amount: 20, gold: 5 },
    { name: 'Predaj drevo +4', res: 'wood', amount: 15, gold: 4 },
    { name: 'Kúp jedlo -8', res: 'food', amount: -25, gold: -8 },
    { name: 'Kúp drevo -6', res: 'wood', amount: -20, gold: -6 },
    { name: 'Kúp kameň -5', res: 'stone', amount: -15, gold: -5 }
  ];
  trades.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'trade-btn';
    btn.textContent = t.name;
    btn.onclick = () => {
      if (t.gold > 0 && resources[t.res] >= t.amount) {
        resources[t.res] -= t.amount;
        resources.gold += t.gold;
        log('Predané!');
      } else if (t.gold < 0 && resources.gold >= -t.gold) {
        resources.gold += t.gold;
        resources[t.res] = (resources[t.res]||0) - t.amount;
        log('Kúpené!');
      } else log('Nedostatok zdrojov');
      updateUI();
    };
    menu.appendChild(btn);
  });
}
function saveGame(slot) {
  const data = {
    resources, buildings, roadTiles: [...roadTiles], riverTiles: [...riverTiles],
    terrainHeights, seed, era, stats, weather, dayTime
  };
  localStorage.setItem('epochSave' + slot, JSON.stringify(data));
  log('Uložené do slotu ' + slot);
}
function loadGame(slot) {
  const raw = localStorage.getItem('epochSave' + slot);
  if (!raw) { log('Slot ' + slot + ' je prázdny'); return; }
  try {
    const data = JSON.parse(raw);
    resources = data.resources;
    buildings = data.buildings || [];
    roadTiles = new Set(data.roadTiles || []);
    riverTiles = new Set(data.riverTiles || []);
    terrainHeights = data.terrainHeights || terrainHeights;
    seed = data.seed || seed;
    era = data.era || 0;
    stats = data.stats || stats;
    weather = data.weather || 'clear';
    dayTime = data.dayTime || 0;
    while (buildingGroup.children.length) buildingGroup.remove(buildingGroup.children[0]);
    buildings.forEach(b => createBuilding(b.type, b.x, b.y, b.level || 1));
    createTerrain();
    createRoads();
    addNature();
    spawnSettlers();
    updateBuildMenu();
    updateUI();
    log('Načítané zo slotu ' + slot);
  } catch(e) { log('Chyba načítania'); }
}
document.getElementById('btn-save1').onclick = () => saveGame(1);
document.getElementById('btn-load1').onclick = () => loadGame(1);
document.getElementById('btn-save2').onclick = () => saveGame(2);
document.getElementById('btn-load2').onclick = () => loadGame(2);
document.getElementById('btn-trade').onclick = () => {
  const tm = document.getElementById('trade-menu');
  tm.style.display = tm.style.display === 'none' ? 'flex' : 'none';
  if (tm.style.display === 'flex') updateTradeMenu();
};
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    mode = btn.dataset.mode;
    document.getElementById('upgrade-menu').style.display = 'none';
    if (mode === 'center') {
      controls.target.set(GRID*TILE/2, 0, GRID*TILE/2);
      camera.position.set(GRID*TILE/2, 28, GRID*TILE/2 + 20);
    }
  };
});
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) / rect.width * 2 - 1;
  mouse.y = -(e.clientY - rect.top) / rect.height * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(terrainGroup.children, true);
  if (intersects.length) {
    const p = intersects[0].point;
    const x = Math.round(p.x / TILE);
    const y = Math.round(p.z / TILE);
    if (x >= 0 && x < GRID && y >= 0 && y < GRID) {
      if (mode === 'upgrade') {
        const th = buildings.find(b => b.type === 'townhall' && b.x === x && b.y === y);
        if (th) {
          showUpgradeMenu(th);
          log('Klikni na tlačidlo upgrade');
        } else {
          log('Klikni na radnicu');
        }
        return;
      }
      if (mode === 'road' && !riverTiles.has(x+','+y) && !roadTiles.has(x+','+y)) {
        if (resources.stone >= 2) {
          resources.stone -= 2;
          roadTiles.add(x + ',' + y);
          createRoads();
          addNature();
          showFeedback(x*TILE, 'Cesta');
          log('Cesta postavená');
          updateUI();
        } else log('Nedostatok kameňa');
      }
      else if (mode === 'sculpt-up') { terrainHeights[y][x] = Math.min(6, terrainHeights[y][x] + 1); createTerrain(); showFeedback(x*TILE, '↑'); log('Zvýšené'); }
      else if (mode === 'sculpt-down') { terrainHeights[y][x] = Math.max(0, terrainHeights[y][x] - 1); createTerrain(); showFeedback(x*TILE, '↓'); log('Znížené'); }
      else if (mode === 'mine') {
        resources.stone += 3 + Math.random()*2;
        resources.coal += Math.random() > 0.6 ? 1 : 0;
        resources.iron += Math.random() > 0.75 ? 1 : 0;
        stats.produced += 3;
        showFeedback(x*TILE, '+3 🪨');
        log('Vyťažené');
        updateUI();
      }
      else if (mode === 'build' && selectedBuilding && !buildings.some(b => b.x===x && b.y===y) && !roadTiles.has(x+','+y)) {
        if (selectedBuilding === 'bridge' && !riverTiles.has(x+','+y)) { log('Most len cez rieku'); return; }
        if (selectedBuilding !== 'bridge' && riverTiles.has(x+','+y)) { log('Nemôžeš stavať na vode'); return; }
        if (selectedBuilding === 'townhall' && buildings.some(b => b.type === 'townhall')) { log('Môžeš mať len jednu radnicu'); return; }
        const bt = buildingTypes[selectedBuilding];
        if (bt.era > era) { log('Potrebuješ vyššiu éru'); return; }
        const cost = bt.cost;
        if (resources.wood >= (cost.wood||0) && resources.stone >= (cost.stone||0)) {
          resources.wood -= cost.wood||0; resources.stone -= cost.stone||0;
          buildings.push({ type: selectedBuilding, x, y, level: 1 });
          createBuilding(selectedBuilding, x, y, 1);
          if (selectedBuilding === 'house') resources.pop += 2;
          tryAutoRoad(x, y);
          spawnSettlers();
          showFeedback(x*TILE, bt.name);
          log('Postavené: ' + bt.name);
          updateUI();
        } else log('Nedostatok zdrojov');
      }
    }
  }
});
function animate() {
  requestAnimationFrame(animate);
  animTime += 0.016;
  updateSettlers();
  buildingGroup.children.forEach(group => {
    group.children.forEach(child => {
      if (child.userData && child.userData.type === 'smoke') {
        child.position.y = (child.parent.children[0].geometry.parameters.height || 1) + 0.4 + Math.sin(animTime * 3 + child.userData.offset) * 0.15;
        child.scale.setScalar(0.8 + Math.sin(animTime * 4 + child.userData.offset) * 0.3);
      }
      if (child.userData && child.userData.type === 'crop') {
        child.rotation.y = animTime * 0.5;
        child.scale.y = 0.8 + Math.sin(animTime * 2) * 0.2;
      }
      if (child.userData && child.userData.type === 'flag') {
        child.rotation.y = Math.sin(animTime * 2) * 0.3;
      }
    });
  });
  controls.update();
  renderer.render(scene, camera);
}
setInterval(() => {
  stats.time++;
  buildings.forEach(b => {
    const bt = buildingTypes[b.type];
    const levelMult = b.level || 1;
    if (bt.consume) {
      let canProduce = true;
      for (const [k, v] of Object.entries(bt.consume)) {
        if ((resources[k] || 0) < v * 0.2) canProduce = false;
      }
      if (canProduce) {
        for (const [k, v] of Object.entries(bt.consume)) resources[k] -= v * 0.2;
        if (bt.prod) for (const [k, v] of Object.entries(bt.prod)) {
          resources[k] = (resources[k]||0) + v * 0.25 * levelMult;
          stats.produced += v * 0.25 * levelMult;
        }
      }
    } else if (bt.prod) {
      for (const [k, v] of Object.entries(bt.prod)) {
        resources[k] = (resources[k]||0) + v * 0.25 * levelMult;
        stats.produced += v * 0.25 * levelMult;
      }
    }
  });
  trees.forEach(t => {
    if (t.age < 1.4 && Math.random() > 0.88) {
      t.age += 0.012;
      if (t.mesh) {
        t.mesh.trunk.scale.set(1, t.age, 1);
        t.mesh.leaves.scale.set(t.age, t.age, t.age);
      }
    }
  });
  const foodNeed = resources.pop * 0.04;
  const waterNeed = resources.pop * 0.02;
  if (resources.food >= foodNeed) resources.food -= foodNeed;
  else resources.happiness -= 0.5;
  if (resources.water >= waterNeed) resources.water -= waterNeed;
  else resources.happiness -= 0.4;
  if (resources.bread > 0 && resources.happiness < 90) {
    resources.bread -= 0.3;
    resources.happiness += 0.3;
  }
  if (weather === 'rain') resources.water += 0.5;
  resources.belief += resources.pop * 0.005;
  resources.science += buildings.filter(b => b.type === 'church').length * 0.1;
  if (resources.happiness < 30 && Math.random() > 0.7) resources.pop = Math.max(4, resources.pop - 1);
  if (resources.pop > stats.maxPop) stats.maxPop = resources.pop;
  if (era < 1 && resources.belief > 150 && resources.science > 20) { era = 1; log('Nová éra: Doba kamenná!'); }
  if (era < 2 && resources.belief > 300 && resources.science > 60 && resources.iron > 20) { era = 2; log('Nová éra: Doba bronzová!'); }
  resources.happiness = Math.max(10, Math.min(100, resources.happiness));
  dayTime = (dayTime + 1) % 120;
  if (dayTime < 20 || dayTime > 100) {
    scene.background = new THREE.Color(0x1a237e);
    ambient.intensity = 0.4;
  } else {
    scene.background = new THREE.Color(0x64b5f6);
    ambient.intensity = 0.8;
  }
  if (Math.random() > 0.97) weather = weather === 'clear' ? 'rain' : 'clear';
  updateUI();
}, 1000);
setInterval(() => saveGame(1), 120000);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
generateTerrain();
createTerrain();
addNature();
spawnSettlers();
updateBuildMenu();
updateUI();
animate();
log('Radnica má teraz detailnejší model (veža, okná, dvere)!');
</script>
