<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<title>Epoch Settlers 3D</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a1a; color: #eee; overflow: hidden; height: 100dvh; touch-action: none; }
#ui { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 10; }
#top-bar { 
  position: absolute; top: 0; left: 0; right: 0;
  background: rgba(22,33,62,0.92); 
  padding: 8px 6px; 
  padding-top: max(8px, env(safe-area-inset-top));
  display: flex; flex-wrap: wrap; gap: 4px; 
  font-size: 12px; 
  pointer-events: none;
}
.resource { background: #0f3460; padding: 4px 8px; border-radius: 12px; white-space: nowrap; font-size: 13px; }
.resource span { font-weight: bold; color: #ffd166; }
#bottom-ui { 
  position: absolute; bottom: 0; left: 0; right: 0; 
  background: rgba(22,33,62,0.97); 
  padding: 8px 6px 12px; 
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  max-height: 42vh; 
  overflow-y: auto; 
  pointer-events: auto;
  border-top: 1px solid #e94560;
}
#modes { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.mode-btn, .build-btn { 
  background: #0f3460; border: 1px solid #e94560; color: white; 
  padding: 10px 12px; border-radius: 8px; font-size: 14px; 
  margin: 2px; min-height: 44px; min-width: 70px;
  flex: 1 1 auto;
}
.mode-btn.selected, .build-btn.selected { background: #e94560; }
#build-menu { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
#log { font-size: 13px; color: #a8dadc; margin: 6px 0; min-height: 18px; text-align: center; }
#canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
canvas { display: block; width: 100% !important; height: 100% !important; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="ui">
  <div id="top-bar">
    <div class="resource">🍞 <span id="res-food">200</span></div>
    <div class="resource">🪵 <span id="res-wood">150</span></div>
    <div class="resource">🪨 <span id="res-stone">100</span></div>
    <div class="resource">💧 <span id="res-water">50</span></div>
    <div class="resource">⚫ <span id="res-coal">0</span></div>
    <div class="resource">⚙️ <span id="res-iron">0</span></div>
    <div class="resource">👥 <span id="res-pop">12</span></div>
    <div class="resource">🙏 <span id="res-belief">70</span></div>
  </div>
  <div id="bottom-ui">
    <div id="modes">
      <button class="mode-btn selected" data-mode="build">🏗️ Stavanie</button>
      <button class="mode-btn" data-mode="road">🛣️ Cesta</button>
      <button class="mode-btn" data-mode="sculpt-up">⬆️ Zvýšiť</button>
      <button class="mode-btn" data-mode="sculpt-down">⬇️ Znížiť</button>
      <button class="mode-btn" data-mode="mine">⛏️ Ťažiť</button>
    </div>
    <div id="build-menu"></div>
    <div id="log"></div>
  </div>
</div>
<div id="canvas-container"></div>
<script>
const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
const GRID = isMobile ? 12 : 16, TILE = 2;
let mode = 'build', selectedBuilding = 'hut';
let resources = { food: 200, wood: 150, stone: 100, water: 50, coal: 0, iron: 0, pop: 12, belief: 70 };
let terrainHeights = Array.from({length: GRID}, () => Array(GRID).fill(0));
let buildings = [];
let trees = [];
let settlers = [];
let riverTiles = new Set();
let roadTiles = new Set();
const buildingTypes = {
  hut: { name: "Chata", cost: { wood: 6, stone: 3 }, prod: { food: 1 }, height: 1.2, color: 0x8d6e63 },
  farm: { name: "Farma", cost: { wood: 8, stone: 4 }, prod: { food: 3 }, height: 1.0, color: 0x66bb6a },
  house: { name: "Dom", cost: { wood: 10, stone: 6 }, prod: { pop: 2 }, height: 1.8, color: 0xffcc80 },
  mine: { name: "Baňa", cost: { wood: 5, stone: 10 }, prod: { stone: 1 }, height: 1.4, color: 0x78909c }
};
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x64b5f6);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 150);
camera.position.set(GRID*TILE/2, 12, GRID*TILE/2 + 8);
camera.lookAt(GRID*TILE/2, 0, GRID*TILE/2);
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.setClearColor(0x64b5f6);
document.getElementById('canvas-container').appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(GRID*TILE/2, 0, GRID*TILE/2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.2;
controls.minDistance = 5;
controls.maxDistance = 30;
const ambient = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(10, 20, 8);
scene.add(sun);
const terrainGroup = new THREE.Group();
scene.add(terrainGroup);
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);
const natureGroup = new THREE.Group();
scene.add(natureGroup);
const roadGroup = new THREE.Group();
scene.add(roadGroup);
const settlerGroup = new THREE.Group();
scene.add(settlerGroup);
function generateTerrain() {
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      terrainHeights[y][x] = Math.max(0, Math.sin(x * 0.4) * Math.cos(y * 0.3) * 2);
    }
  }
  for (let y = 1; y < GRID - 1; y++) {
    const x = Math.floor(GRID / 2);
    riverTiles.add(x + ',' + y);
    terrainHeights[y][x] = 0;
  }
}
function createTerrain() {
  while (terrainGroup.children.length) terrainGroup.remove(terrainGroup.children[0]);
  const geo = new THREE.BoxGeometry(TILE, 0.4, TILE);
  const matGrass = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
  const matWater = new THREE.MeshLambertMaterial({ color: 0x2196f3 });
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const isRiver = riverTiles.has(x + ',' + y);
      const h = terrainHeights[y][x];
      const height = isRiver ? 0.1 : 0.4 + h * 0.3;
      const mesh = new THREE.Mesh(geo, isRiver ? matWater : matGrass);
      mesh.position.set(x*TILE, height/2, y*TILE);
      mesh.scale.y = height;
      terrainGroup.add(mesh);
    }
  }
}
function createRoads() {
  while (roadGroup.children.length) roadGroup.remove(roadGroup.children[0]);
  const geo = new THREE.BoxGeometry(TILE * 0.7, 0.08, TILE * 0.7);
  const matRoad = new THREE.MeshLambertMaterial({ color: 0x6d4c41 });
  roadTiles.forEach(key => {
    const [x, y] = key.split(',').map(Number);
    const mesh = new THREE.Mesh(geo, matRoad);
    mesh.position.set(x*TILE, 0.12, y*TILE);
    roadGroup.add(mesh);
  });
}
function addNature() {
  while (natureGroup.children.length) natureGroup.remove(natureGroup.children[0]);
  trees = [];
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      if (riverTiles.has(x + ',' + y) || roadTiles.has(x + ',' + y) || buildings.some(b => b.x === x && b.y === y)) continue;
      if (Math.random() > 0.65) {
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 1.2, 4), new THREE.MeshLambertMaterial({ color: 0x5d4037 }));
        const leaves = new THREE.Mesh(new THREE.SphereGeometry(0.6, 5, 4), new THREE.MeshLambertMaterial({ color: 0x2e7d32 }));
        trunk.position.set(x*TILE, 0.7, y*TILE);
        leaves.position.set(x*TILE, 1.5, y*TILE);
        natureGroup.add(trunk, leaves);
        trees.push({ x, y });
      }
    }
  }
}
function spawnSettlers() {
  while (settlerGroup.children.length) settlerGroup.remove(settlerGroup.children[0]);
  settlers = [];
  for (let i = 0; i < Math.min(resources.pop, 6); i++) {
    const x = Math.floor(Math.random() * GRID);
    const y = Math.floor(Math.random() * GRID);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 0.5, 4), new THREE.MeshLambertMaterial({ color: 0xffcc80 }));
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 4, 3), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
    body.position.set(x*TILE, 0.35, y*TILE);
    head.position.set(x*TILE, 0.7, y*TILE);
    settlerGroup.add(body, head);
    settlers.push({ x, y, mesh: { body, head }, onRoad: false });
  }
}
function updateSettlers() {
  settlers.forEach(s => {
    if (Math.random() > 0.94) {
      const speed = s.onRoad ? 0.08 : 0.04;
      s.x = Math.max(0, Math.min(GRID-1, s.x + (Math.random()-0.5)*3));
      s.y = Math.max(0, Math.min(GRID-1, s.y + (Math.random()-0.5)*3));
      s.onRoad = roadTiles.has(Math.round(s.x) + ',' + Math.round(s.y));
    }
    if (s.mesh) {
      s.mesh.body.position.set(s.x*TILE, 0.35, s.y*TILE);
      s.mesh.head.position.set(s.x*TILE, 0.7, s.y*TILE);
    }
  });
}
function createBuilding(type, x, y) {
  const bt = buildingTypes[type];
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(TILE*0.65, bt.height, TILE*0.65), new THREE.MeshLambertMaterial({ color: bt.color }));
  body.position.y = bt.height / 2;
  group.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(TILE*0.45, bt.height * 0.4, 4), new THREE.MeshLambertMaterial({ color: 0x3e2723 }));
  roof.position.y = bt.height + 0.1;
  roof.rotation.y = Math.PI / 4;
  group.add(roof);
  group.position.set(x*TILE, 0, y*TILE);
  buildingGroup.add(group);
}
function updateUI() {
  ['food','wood','stone','water','coal','iron','pop','belief'].forEach(k => {
    const el = document.getElementById('res-' + k);
    if (el) el.textContent = Math.floor(resources[k] || 0);
  });
}
function log(msg) { document.getElementById('log').textContent = msg; }
function updateBuildMenu() {
  const menu = document.getElementById('build-menu');
  menu.innerHTML = '';
  Object.entries(buildingTypes).forEach(([k, v]) => {
    const btn = document.createElement('button');
    btn.className = 'build-btn' + (selectedBuilding === k ? ' selected' : '');
    btn.textContent = v.name;
    btn.onclick = () => { selectedBuilding = k; updateBuildMenu(); };
    menu.appendChild(btn);
  });
}
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    mode = btn.dataset.mode;
  };
});
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) / rect.width * 2 - 1;
  mouse.y = -(e.clientY - rect.top) / rect.height * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(terrainGroup.children, true);
  if (intersects.length) {
    const p = intersects[0].point;
    const x = Math.round(p.x / TILE);
    const y = Math.round(p.z / TILE);
    if (x >= 0 && x < GRID && y >= 0 && y < GRID) {
      if (mode === 'road' && !riverTiles.has(x+','+y) && !roadTiles.has(x+','+y)) {
        if (resources.stone >= 2) {
          resources.stone -= 2;
          roadTiles.add(x + ',' + y);
          createRoads();
          addNature();
          log('Cesta postavená');
          updateUI();
        } else log('Nedostatok kameňa');
      }
      else if (mode === 'sculpt-up') { terrainHeights[y][x] = Math.min(4, terrainHeights[y][x] + 1); createTerrain(); log('Zvýšené'); }
      else if (mode === 'sculpt-down') { terrainHeights[y][x] = Math.max(0, terrainHeights[y][x] - 1); createTerrain(); log('Znížené'); }
      else if (mode === 'mine') {
        resources.stone += 3;
        log('Vyťažené');
        updateUI();
      }
      else if (mode === 'build' && selectedBuilding && !buildings.some(b => b.x===x && b.y===y) && !riverTiles.has(x+','+y) && !roadTiles.has(x+','+y)) {
        const cost = buildingTypes[selectedBuilding].cost;
        if (resources.wood >= (cost.wood||0) && resources.stone >= (cost.stone||0)) {
          resources.wood -= cost.wood||0; resources.stone -= cost.stone||0;
          buildings.push({ type: selectedBuilding, x, y });
          createBuilding(selectedBuilding, x, y);
          if (selectedBuilding === 'house') resources.pop += 2;
          spawnSettlers();
          log('Postavené');
          updateUI();
        } else log('Nedostatok zdrojov');
      }
    }
  }
});
function animate() {
  requestAnimationFrame(animate);
  updateSettlers();
  controls.update();
  renderer.render(scene, camera);
}
setInterval(() => {
  buildings.forEach(b => {
    const prod = buildingTypes[b.type].prod;
    if (prod) Object.entries(prod).forEach(([k,v]) => resources[k] = (resources[k]||0) + v * 0.25);
  });
  resources.belief += resources.pop * 0.008;
  if (resources.food > 5) resources.food -= resources.pop * 0.02;
  updateUI();
}, 1000);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
generateTerrain();
createTerrain();
addNature();
spawnSettlers();
updateBuildMenu();
updateUI();
animate();
log('Režim Cesta: stavaj cesty medzi budovami. Obyvatelia po nich idú rýchlejšie.');
</script>
</body>
</html>
